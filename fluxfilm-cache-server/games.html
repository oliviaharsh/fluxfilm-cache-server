<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<meta name="theme-color" content="#16a34a" />
<meta name="robots" content="noindex" />
<link rel="manifest" href="/manifest.webmanifest" />
<link rel="icon" href="/icons/icon-192.png" />
<title>FluxFilm Games — play free, win coins</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Bricolage+Grotesque:opsz,wght@12..96,700;12..96,800&display=swap" rel="stylesheet" />
<!--
  FluxFilm Games (games.js decides and scores every game; this page only shows it and sends taps).
  Login = the shop's saved phone (localStorage ff_session_v2 / ff_phone). Prizes need the email-code token that Get OTP
  also uses (ff_otp_access_<phone>). Everything the owner controls comes from getGamesHome / gameStart.
-->
<style>
:root{
  --ground:#f5f7fb; --surface:#ffffff; --surface-2:#f8fafc; --ink:#0f172a; --muted:#64748b; --line:rgba(15,23,42,.08);
  --green:#16a34a; --green-ink:#15803d; --green-soft:rgba(22,163,74,.09);
  --gold:#d97706; --gold-ink:#92400e; --gold-soft:#fffbeb; --gold-line:rgba(217,119,6,.28);
  --red:#dc2626; --red-soft:rgba(220,38,38,.08); --blue-soft:rgba(37,99,235,.08); --blue-ink:#1d4ed8;
  --slice-a:#16a34a; --slice-b:#f59e0b; --slice-c:#0f766e; --slice-d:#e2e8f0; --slice-text-d:#475569;
  --field:#dcfce7; --field-2:#bbf7d0; --pitch:#e7d3a8; --sky:#eef2ff; --sky-2:#fdf4ff; --turf:#15803d; --turf-2:#166534;
  --shadow:0 10px 30px rgba(15,23,42,.07);
}
@media (prefers-color-scheme: dark){
  :root{
    --ground:#0b1210; --surface:#121b18; --surface-2:#18231f; --ink:#e7eef0; --muted:#93a39e; --line:rgba(231,238,240,.1);
    --green:#22c55e; --green-ink:#4ade80; --green-soft:rgba(34,197,94,.13);
    --gold:#fbbf24; --gold-ink:#fcd34d; --gold-soft:rgba(251,191,36,.1); --gold-line:rgba(251,191,36,.3);
    --red:#f87171; --red-soft:rgba(248,113,113,.12); --blue-soft:rgba(96,165,250,.12); --blue-ink:#93c5fd;
    --slice-a:#15803d; --slice-b:#d97706; --slice-c:#0f766e; --slice-d:#253330; --slice-text-d:#b6c4bf;
    --field:#12301f; --field-2:#174029; --pitch:#5b4a2c; --sky:#151b2e; --sky-2:#23172b; --turf:#14532d; --turf-2:#0f3f22;
    --shadow:0 10px 30px rgba(0,0,0,.35);
  }
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--ground);color:var(--ink);font-family:'Plus Jakarta Sans',ui-sans-serif,system-ui,sans-serif;padding-inline:16px;padding-block:0 calc(40px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
[hidden]{display:none!important}
button{font-family:inherit;cursor:pointer}
button:focus-visible,a:focus-visible{outline:3px solid var(--green);outline-offset:2px}
.disp{font-family:'Bricolage Grotesque','Plus Jakarta Sans',sans-serif;letter-spacing:-.02em}
.phone{max-width:460px;margin:0 auto;display:flex;flex-direction:column;gap:14px}
.top{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 0 10px;background:color-mix(in srgb,var(--ground) 92%,transparent);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px)}
.back{min-height:44px;min-width:44px;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;font-size:15px;font-weight:800;display:inline-flex;align-items:center;justify-content:center;gap:4px;padding:0 12px;text-decoration:none}
.top h1{font-size:24px;font-weight:800;margin:0}
.coins{margin-left:auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 13px;border-radius:999px;background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold-ink);font-weight:800;font-size:15px;font-variant-numeric:tabular-nums}
.coin{width:18px;height:18px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fde68a,#f59e0b 60%,#b45309);box-shadow:inset 0 -1px 0 rgba(0,0,0,.2);flex-shrink:0;display:inline-block}
.coin.sm{width:14px;height:14px;vertical-align:-2px}

.banner{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;border:1px solid var(--line);background:var(--surface);font-size:13.5px;line-height:1.45}
.banner.warn{background:var(--gold-soft);border-color:var(--gold-line)}
.banner.info{background:var(--blue-soft);border-color:rgba(37,99,235,.2)}
.banner b{font-weight:800}
.banner .bi{font-size:24px;flex-shrink:0}
.banner .bb{margin-left:auto;flex-shrink:0;min-height:40px;border:0;border-radius:12px;padding:8px 12px;font-weight:800;font-size:13px;background:var(--green);color:#fff;text-decoration:none;display:inline-flex;align-items:center}

.spin{background:var(--surface);border-radius:24px;box-shadow:var(--shadow);border:1px solid var(--line);padding:18px 18px 20px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.eyebrow{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--green-ink)}
.spin h2{font-size:28px;line-height:1.05;font-weight:800;margin:0}
.wheelwrap{position:relative;width:min(100%,270px);aspect-ratio:1;max-width:100%}
.wheel{width:100%;height:100%;transition:transform 3.6s cubic-bezier(.12,.7,.1,1)}
.pointer{position:absolute;left:50%;top:-6px;transform:translateX(-50%);width:0;height:0;border-left:13px solid transparent;border-right:13px solid transparent;border-top:24px solid var(--ink);z-index:2}
.hub{position:absolute;inset:50% auto auto 50%;transform:translate(-50%,-50%);width:58px;height:58px;border-radius:50%;background:var(--surface);border:4px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:12px;color:var(--ink)}
.cta{min-height:52px;width:100%;border:0;border-radius:16px;background:var(--green);color:#fff;font-size:17px;font-weight:800;box-shadow:0 6px 18px rgba(22,163,74,.3);display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:0 16px}
.cta.paid{background:var(--gold);color:#1c1204;box-shadow:0 6px 18px rgba(217,119,6,.28)}
.cta.soft{background:var(--surface-2);color:var(--ink);box-shadow:none;border:1px solid var(--line)}
.cta:disabled{background:var(--surface-2);color:var(--muted);box-shadow:none;cursor:default}
.hint{font-size:13px;color:var(--muted);margin:0}
.result{font-weight:800;color:var(--gold-ink);font-size:16px;min-height:22px;margin:0}
.odds{font-size:12px;color:var(--muted);background:none;border:0;text-decoration:underline;padding:4px}

.panel{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:14px 16px;display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.row b{font-size:15px}
.row span{font-size:13px;color:var(--muted)}
.days{display:grid;grid-template-columns:repeat(7,1fr);gap:6px}
.day{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:11px;color:var(--muted);font-weight:700}
.dot{width:100%;max-width:38px;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;font-size:14px;border:2px solid var(--line);background:var(--surface)}
.dot.done{background:var(--green);border-color:var(--green);color:#fff}
.dot.today{border-color:var(--green);border-style:dashed;color:var(--green-ink)}
.dot.bonus{border-color:var(--gold-line);background:var(--gold-soft)}
.meter{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--gold),var(--green));border-radius:99px}
.sep{height:1px;background:var(--line)}
.cps{display:flex;flex-direction:column;gap:8px}
.cp{display:flex;align-items:center;gap:10px;padding:9px 12px;border-radius:12px;background:var(--surface);border:1px dashed var(--gold-line);font-size:13px}
.cp code{font-weight:800;font-size:14px;letter-spacing:.04em;color:var(--gold-ink)}
.cp .cpv{font-weight:800}
.cp button{margin-left:auto;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:10px;font-weight:700;font-size:12px;min-height:34px;padding:0 10px}
.cp.used{opacity:.55;border-style:solid}

.listhead{display:flex;align-items:baseline;justify-content:space-between;margin-top:4px}
.listhead h3{font-size:20px;margin:0}
.listhead span{font-size:12.5px;color:var(--muted)}
.games{display:flex;flex-direction:column;background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden}
.game{display:grid;grid-template-columns:48px 1fr auto;align-items:center;gap:12px;padding:14px;border:0;background:none;color:var(--ink);text-align:left;width:100%;min-height:74px}
.game + .game{border-top:1px solid var(--line)}
.gi{width:48px;height:48px;border-radius:14px;display:grid;place-items:center;font-size:24px;background:var(--green-soft)}
.gi.sport{background:var(--blue-soft)}
.gt b{display:block;font-size:15.5px}
.gt small{display:block;font-size:12.5px;color:var(--muted);margin-top:2px;line-height:1.35}
.pill{font-size:12px;font-weight:800;padding:6px 10px;border-radius:999px;white-space:nowrap;display:inline-flex;align-items:center;gap:4px}
.pill.play{background:var(--green);color:#fff}
.pill.paid{background:var(--gold-soft);color:var(--gold-ink);border:1px solid var(--gold-line)}
.pill.done{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.pill.practice{background:var(--blue-soft);color:var(--blue-ink)}
.rules{font-size:12px;line-height:1.55;color:var(--muted);padding:2px 4px;margin:0}
.rules b{color:var(--ink)}
.rules button{border:0;background:none;color:var(--ink);text-decoration:underline;font-size:12px;padding:0}
.skel{height:120px;border-radius:18px;background:linear-gradient(90deg,var(--surface-2),var(--surface),var(--surface-2));background-size:200% 100%;animation:sk 1.2s linear infinite}
@keyframes sk{to{background-position:-200% 0}}
.empty{text-align:center;padding:30px 18px;background:var(--surface);border:1px solid var(--line);border-radius:22px}
.empty .big{font-size:56px}
.empty h2{margin:8px 0 6px;font-size:24px}
.empty p{margin:0 0 14px;color:var(--muted)}

/* sheets */
.scrim{position:fixed;inset:0;background:rgba(2,6,23,.5);z-index:30;display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:460px;background:var(--surface);border-radius:24px 24px 0 0;padding:18px 16px calc(24px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px;animation:up .25s ease-out;max-height:92dvh;overflow:auto}
@keyframes up{from{transform:translateY(40px);opacity:.4}to{transform:none;opacity:1}}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h3{margin:0;font-size:22px;text-wrap:balance}
.sheet p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5}
.sheet ul{margin:0;padding-left:18px;color:var(--muted);font-size:13.5px;line-height:1.55}
.close{min-height:48px;border-radius:14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:800;font-size:15px;width:100%}
.codein{min-height:54px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:24px;font-weight:800;letter-spacing:.3em;text-align:center;width:100%;font-family:inherit}
.err{color:var(--red);font-size:13.5px;font-weight:700;min-height:18px}

/* game screen */
.gs{position:fixed;inset:0;z-index:25;background:var(--ground);display:flex;justify-content:center}
.gs-in{width:100%;max-width:460px;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top)) 16px calc(16px + env(safe-area-inset-bottom));gap:12px;height:100dvh}
.gs-top{display:flex;align-items:center;gap:10px;min-height:44px}
.gs-top h2{font-size:20px;margin:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hud{margin-left:auto;display:flex;gap:6px;flex-shrink:0}
.hud span{font-size:12.5px;font-weight:800;padding:6px 9px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-variant-numeric:tabular-nums;white-space:nowrap}
.stage{flex:1;min-height:0;position:relative;border-radius:22px;overflow:hidden;border:1px solid var(--line);background:var(--surface)}
.stage canvas{display:block;width:100%;height:100%;touch-action:none;user-select:none;-webkit-user-select:none}
.card{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding:22px;background:color-mix(in srgb,var(--surface) 96%,transparent);overflow:auto}
.card .big{font-size:60px;line-height:1}
.card h3{font-size:30px;margin:0;line-height:1.05;text-wrap:balance}
.card p{margin:0;color:var(--muted);font-size:14.5px;line-height:1.5;max-width:34ch}
.prizes{width:100%;max-width:330px;border:1px solid var(--line);border-radius:14px;background:var(--surface-2);text-align:left;font-size:13px;overflow:hidden}
.prizes div{display:flex;justify-content:space-between;gap:10px;padding:8px 12px}
.prizes div + div{border-top:1px solid var(--line)}
.prizes b{color:var(--gold-ink);white-space:nowrap}
.card .cta,.card .close{max-width:330px}
.score{font-size:56px;font-weight:800;line-height:1;font-variant-numeric:tabular-nums}
.won{display:flex;flex-direction:column;gap:6px;align-items:center}
.chip{padding:8px 14px;border-radius:999px;background:var(--gold-soft);border:1px solid var(--gold-line);color:var(--gold-ink);font-weight:800;font-size:14px}
.chip.cp2{border-style:dashed}
.chip.grey{background:var(--surface-2);border-color:var(--line);color:var(--muted)}
.chip.blue{background:var(--blue-soft);border-color:rgba(37,99,235,.2);color:var(--blue-ink)}
.emo{position:absolute;inset:0;display:flex;flex-direction:column;gap:14px;padding:16px;overflow:auto}
.qtext{font-size:21px;font-weight:800;line-height:1.25;text-wrap:balance;margin:6px 0 0}
.emoji-q{font-size:clamp(46px,15vw,74px);text-align:center;line-height:1.15;padding:14px 0 4px;letter-spacing:.06em}
.timer{height:8px;border-radius:99px;background:var(--line);overflow:hidden}
.timer i{display:block;height:100%;background:var(--green);width:100%}
.lbl{text-align:center;font-size:13px;color:var(--muted);font-weight:700}
.opts{display:grid;gap:9px}
.opts.two{grid-template-columns:1fr 1fr}
.opt{min-height:54px;text-align:left;padding:12px 14px;border-radius:14px;border:1.5px solid var(--line);background:var(--surface-2);color:var(--ink);font-size:15px;font-weight:700;line-height:1.3}
.opt.right{border-color:var(--green);background:var(--green-soft);color:var(--green-ink)}
.opt.wrong{border-color:var(--red);background:var(--red-soft);color:var(--red)}
.opt:disabled{cursor:default}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translate(-50%,20px);opacity:0;background:var(--ink);color:var(--ground);padding:11px 16px;border-radius:999px;font-weight:800;font-size:14px;transition:.25s;z-index:60;pointer-events:none;max-width:calc(100% - 32px);text-align:center}
.toast.show{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion: reduce){.wheel{transition:none}.sheet{animation:none}.toast{transition:none}.skel{animation:none}}
</style>
</head>
<body>
<div class="phone">
  <header class="top">
    <a class="back" href="/" aria-label="Back to the shop">← Shop</a>
    <h1 class="disp">Games</h1>
    <span class="coins" id="coinChip" hidden aria-label="Coin balance"><span class="coin"></span><span id="bal">0</span></span>
  </header>
  <main id="main" class="phone" style="gap:14px"><div class="skel"></div><div class="skel" style="height:220px"></div></main>
</div>

<div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>

<div class="gs" id="gs" hidden>
  <div class="gs-in">
    <div class="gs-top">
      <button class="back" id="gsClose" aria-label="Close game">✕</button>
      <h2 class="disp" id="gsTitle">Game</h2>
      <div class="hud" id="hud"></div>
    </div>
    <div class="stage" id="stage"></div>
  </div>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };
  var esc = function (v) { return String(v == null ? '' : v).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); };
  var tok = function (n) { return getComputedStyle(document.documentElement).getPropertyValue(n).trim(); };
  var normPhone = function (v) { var d = String(v || '').replace(/\D/g, ''); return d ? d.slice(-10) : ''; };
  var S = { phone: '', token: '', home: null, current: null, spinning: false, rot: 0 };
  var SPORT = { cricket: 1, yorker: 1, penalty: 1 };
  var BLURB = {
    quiz: 'Movies, series, anime & cricket questions', emoji: 'Guess the movie from emojis, beat the clock',
    popcorn: 'Catch popcorn, dodge spoilers & buffering', cricket: 'Chase the target in a tough Super Over',
    yorker: 'Bowl yorkers at the stumps — take wickets', penalty: 'Beat the keeper from the spot'
  };
  var HOW = {
    quiz: function (g) { return g.questions + ' questions, ' + g.seconds + ' seconds each. Tap the right answer.'; },
    emoji: function (g) { return g.rounds + ' emoji clues, ' + g.seconds + ' seconds each. Which movie or show is it?'; },
    popcorn: function (g) { return 'Drag the box to catch 🍿 (10) and ⭐ (50). Dodge ⚠️ spoilers and 🔄 buffering. ' + g.lives + ' lives, ' + g.seconds + ' seconds.'; },
    cricket: function (g) { return 'Tap anywhere when the ball reaches the orange line. Perfect = SIX. Too late = BOWLED. Watch out for slower balls! ' + g.balls + ' balls, ' + g.wickets + ' wickets.'; },
    yorker: function (g) { return 'The ball runs down the pitch. Tap to pitch it inside the red yorker zone at the batter\'s feet to take a wicket. ' + g.balls + ' balls — take ' + g.winWickets + ' wickets to win.'; },
    penalty: function (g) { return 'Tap where to shoot, then stop the power bar in the green zone. The keeper dives — pick your corner! ' + g.kicks + ' kicks, score ' + g.winGoals + ' to win.'; }
  };
  function prizeRows(k, g) {
    var c = function (n) { return n + ' coin' + (n === 1 ? '' : 's'); };
    var rows = [];
    if (k === 'quiz' || k === 'emoji') { if (g.coinsPerRight) rows.push(['Each right answer', c(g.coinsPerRight)]); if (g.perfectBonus) rows.push(['All right', '+' + c(g.perfectBonus)]); if (g.perfectCoupon) rows.push(['All right', '₹' + g.perfectCoupon + ' coupon']); }
    if (k === 'popcorn') { rows.push(['Every ' + g.pointsPerCoin + ' points', '1 coin (max ' + g.maxCoins + ')']); if (g.couponAt) rows.push([g.couponAt + '+ points', '₹' + g.couponValue + ' coupon']); }
    if (k === 'cricket') { if (g.winCoins) rows.push(['Chase the target', c(g.winCoins)]); if (g.runCoins) rows.push(['Each run', c(g.runCoins)]); if (g.couponSixes) rows.push(['Win with ' + g.couponSixes + '+ sixes', '₹' + g.couponValue + ' coupon']); }
    if (k === 'yorker') { if (g.wicketCoins) rows.push(['Each wicket', c(g.wicketCoins)]); if (g.winCoins) rows.push([g.winWickets + '+ wickets', '+' + c(g.winCoins)]); if (g.couponAllYorkers) rows.push(['Every ball a wicket', '₹' + g.couponAllYorkers + ' coupon']); }
    if (k === 'penalty') { if (g.goalCoins) rows.push(['Each goal', c(g.goalCoins)]); if (g.winGoals && g.winCoins) rows.push([g.winGoals + '+ goals', '+' + c(g.winCoins)]); if (g.couponAllGoals) rows.push(['Every kick a goal', '₹' + g.couponAllGoals + ' coupon']); }
    return rows;
  }

  // ---------- login + api ----------
  function readLogin() {
    var ph = '';
    try { var s = JSON.parse(localStorage.getItem('ff_session_v2') || '{}'); ph = normPhone(s && s.phone); } catch (e) {}
    if (!ph) { try { ph = normPhone(localStorage.getItem('ff_phone')); } catch (e) {} }
    S.phone = ph && ph.length === 10 ? ph : '';
    S.token = '';
    if (S.phone) { try { var r = JSON.parse(localStorage.getItem('ff_otp_access_' + S.phone) || 'null'); if (r && r.token && Date.parse(r.expiresAt) > Date.now()) S.token = r.token; } catch (e) {} }
  }
  function api(action, args) {
    return fetch('/api', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ action: action, args: args || [] }) })
      .then(function (r) { return r.json().catch(function () { return { ok: false, message: 'Something went wrong. Please try again.' }; }); })
      .catch(function () { return { ok: false, offline: true, message: 'No internet connection. Check your network and try again.' }; });
  }
  var tt; function toast(m) { var t = $('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(tt); tt = setTimeout(function () { t.classList.remove('show'); }, 2600); }

    slices.forEach(function (sl, i) {

      var fill = blank ? '--slice-d' : fills[(colour++) % 3];
      s += '<path d="M0 0 L' + p0[0].toFixed(2) + ' ' + p0[1].toFixed(2) + ' A' + R + ' ' + R + ' 0 ' + (step > 180 ? 1 : 0) + ' 1 ' + p1[0].toFixed(2) + ' ' + p1[1].toFixed(2) + ' Z" fill="var(' + fill + ')" stroke="var(--surface)" stroke-width="2"/>';
      var label = esc(String(sl.label).slice(0, 10)), small = label.length > 4;
      s += '<g transform="rotate(' + mid + ') translate(0 -70)"><text text-anchor="middle" dominant-baseline="middle" font-family="Plus Jakarta Sans, sans-serif" font-weight="800" font-size="' + (small ? 9 : 17) + '" fill="' + (blank ? 'var(--slice-text-d)' : '#ffffff') + '">' + label + '</text></g>';
    });

      if (landed) { landed.life -= dt; ctx.globalAlpha = Math.max(0, landed.life); ctx.strokeStyle = landed.wicket ? col.gold : '#ffffff'; ctx.lineWidth = 3; ctx.beginPath(); ctx.arc(W / 2, yOf(landed.p), 14 + (1.2 - landed.life) * 20, 0, Math.PI * 2); ctx.stroke(); ctx.globalAlpha = 1; if (landed.life <= 0) landed = null; }
      var lx = W / 2 - (d.balls * 26) / 2 + 13;
      for (var b2 = 0; b2 < d.balls; b2++) { var v = log[b2]; ctx.fillStyle = v === undefined ? col.surface : v === 'W' ? col.gold : v >= 4 ? col.red : col.surface; ctx.globalAlpha = v === undefined ? .55 : 1; ctx.beginPath(); ctx.arc(lx + b2 * 26, 18, 10, 0, Math.PI * 2); ctx.fill(); ctx.globalAlpha = 1; ctx.fillStyle = (v === 'W' || v >= 4) ? '#ffffff' : col.ink; ctx.font = '800 11px "Plus Jakarta Sans", sans-serif'; ctx.fillText(v === undefined ? '' : String(v), lx + b2 * 26, 18.5); }
      if (msg) { msg.life -= dt * .9; ctx.globalAlpha = Math.max(0, Math.min(1, msg.life * 1.6)); ctx.font = '800 ' + (msg.good || msg.bad ? 30 : 22) + 'px "Bricolage Grotesque", "Plus Jakarta Sans", sans-serif'; ctx.fillStyle = msg.good ? '#fde68a' : msg.bad ? '#fecaca' : '#ffffff'; ctx.fillText(msg.text, W / 2, H * .38 - (1 - msg.life) * 16); ctx.globalAlpha = 1; if (msg.life <= 0) msg = null; }
      if (bi === 0 && !m && !msg) { ctx.fillStyle = '#ffffff'; ctx.font = '700 14px "Plus Jakarta Sans", sans-serif'; ctx.fillText('Tap to pitch the ball in the red zone', W / 2, H * .38); }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }

  // ---------- Penalty Shootout (the keeper's dive is revealed by the server after each kick) ----------
  function runPenalty(k, play) {
    var d = play.data, c = makeCanvas(), ctx = c.ctx, W = c.W, H = c.H, cv = c.cv;
    var col = { turf: tok('--turf'), turf2: tok('--turf-2'), ink: tok('--ink'), gold: tok('--gold'), red: tok('--red'), green: tok('--green'), surface: tok('--surface') };
    var gw = Math.min(W - 40, 340), gh = gw * .42, gx = (W - gw) / 2, gy = Math.max(56, Math.min(H * .2, H - 330));
    var zc = function (z) { var r = z < 3 ? 0 : 1, cc = z % 3; return [gx + gw * (cc + .5) / 3, gy + gh * (r + .5) / 2]; };
    var ki = 0, goals = 0, log = [], phase = 'aim', zone = -1, mt0 = 0, alive = true, raf, last = performance.now(), anim = null, msg = null, busy = false;
    var hud = function () { $('hud').innerHTML = '<span>⚽ ' + goals + ' goals</span><span>Kick ' + Math.min(ki + 1, d.kicks) + '/' + d.kicks + '</span>'; };
    hud();
    var power = function (now) { var ph = (((now - mt0) / 1000) * d.meterSpeed) % 2; return (ph < 1 ? ph : 2 - ph) * 1000; };
    function zoneAt(x, y) { if (x < gx || x > gx + gw || y < gy || y > gy + gh) return -1; return (y < gy + gh / 2 ? 0 : 3) + Math.min(2, Math.floor((x - gx) / (gw / 3))); }
    function tap(e) {
      if (e) e.preventDefault();
      if (busy || anim) return;
      var r = cv.getBoundingClientRect(), x = e.clientX - r.left, y = e.clientY - r.top;
      if (phase === 'aim') { var z = zoneAt(x, y); if (z < 0) { msg = { text: 'Tap inside the goal', life: .8 }; return; } zone = z; phase = 'power'; mt0 = performance.now(); return; }
      if (phase === 'power') {
        var p = Math.round(power(performance.now())); busy = true; var kickZone = zone;
        api('gameStep', [S.phone, S.token, play.playId, { i: ki, zone: kickZone, power: p }]).then(function (res) {
          busy = false; if (!alive) return;
          if (!res.ok) { if (res.expected != null) ki = res.expected; toast(res.message || 'Connection problem'); if (res.finished) closeGame(); phase = 'aim'; zone = -1; return; }
          goals = res.goals; log.push(res.outcome); ki++;
          anim = { t: 0, zone: kickZone, keeper: res.keeperZone, outcome: res.outcome, why: res.why };
          msg = { text: res.outcome === 'GOAL' ? 'GOAL! ⚽' : res.outcome === 'MISS' ? 'Over the bar!' : res.why === 'weak' ? 'Too soft — saved' : 'SAVED!', life: 1.4, good: res.outcome === 'GOAL' };
          buzz(res.outcome === 'GOAL' ? [30, 30, 90] : 80); hud();
        });
        phase = 'wait';
      }
    }
    cv.addEventListener('pointerdown', tap);
    S.current = { running: true, stop: function () { alive = false; cancelAnimationFrame(raf); } };
    function frame(now) {
      if (!alive) return;
      var dt = Math.min(.05, (now - last) / 1000); last = now;
      ctx.fillStyle = col.turf; ctx.fillRect(0, 0, W, H);
      ctx.fillStyle = col.turf2; for (var s2 = 0; s2 < H; s2 += 50) ctx.fillRect(0, s2, W, 25);
      // goal + net
      ctx.strokeStyle = 'rgba(255,255,255,.35)'; ctx.lineWidth = 1;
      for (var nx = gx; nx <= gx + gw; nx += 14) { ctx.beginPath(); ctx.moveTo(nx, gy); ctx.lineTo(nx, gy + gh); ctx.stroke(); }
      for (var ny = gy; ny <= gy + gh; ny += 14) { ctx.beginPath(); ctx.moveTo(gx, ny); ctx.lineTo(gx + gw, ny); ctx.stroke(); }
      ctx.strokeStyle = '#ffffff'; ctx.lineWidth = 6; ctx.beginPath(); ctx.moveTo(gx, gy + gh + 2); ctx.lineTo(gx, gy); ctx.lineTo(gx + gw, gy); ctx.lineTo(gx + gw, gy + gh + 2); ctx.stroke();
      ctx.strokeStyle = 'rgba(255,255,255,.6)'; ctx.lineWidth = 2; ctx.beginPath(); ctx.moveTo(10, gy + gh + 4); ctx.lineTo(W - 10, gy + gh + 4); ctx.stroke();
      if (phase === 'aim' && !anim) { for (var z = 0; z < 6; z++) { var p = zc(z); ctx.strokeStyle = 'rgba(255,255,255,.55)'; ctx.setLineDash([4, 4]); ctx.strokeRect(p[0] - gw / 6 + 4, p[1] - gh / 4 + 4, gw / 3 - 8, gh / 2 - 8); ctx.setLineDash([]); } }
      if (zone >= 0 && (phase === 'power' || phase === 'wait')) { var pz = zc(zone); ctx.fillStyle = 'rgba(253,230,138,.35)'; ctx.fillRect(pz[0] - gw / 6 + 3, pz[1] - gh / 4 + 3, gw / 3 - 6, gh / 2 - 6); ctx.font = '22px ' + EMOJI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🎯', pz[0], pz[1]); }
      // keeper
      var kx = W / 2, ky = gy + gh * .62, kr = 0;
      if (anim) { anim.t += dt; var kp = zc(anim.keeper), prog = Math.min(1, anim.t / .45); kx = W / 2 + (kp[0] - W / 2) * prog; ky = ky + (kp[1] - ky) * prog; kr = (kp[0] < W / 2 - 5 ? -1 : kp[0] > W / 2 + 5 ? 1 : 0) * prog * 1.1; }
      else if (phase !== 'wait') { kx = W / 2 + Math.sin(now / 380) * gw * .06; }
      ctx.save(); ctx.translate(kx, ky); ctx.rotate(kr); ctx.font = '44px ' + EMOJI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('🧤', 0, 0); ctx.restore();
      // ball
      var bx0 = W / 2, by0 = H - 150, bx = bx0, by = by0, bs = 34;
      if (anim) {
        var tp = Math.min(1, anim.t / .5), target = zc(anim.zone);
        if (anim.outcome === 'MISS') target = [target[0], gy - 40];
        if (anim.outcome === 'SAVED') target = [bx0 + (kx - bx0) * .96, by0 + (ky - by0) * .96];
        bx = bx0 + (target[0] - bx0) * tp; by = by0 + (target[1] - by0) * tp - Math.sin(tp * Math.PI) * 30; bs = 34 - 14 * tp;
        if (anim.t > 1.5) { anim = null; zone = -1; phase = ki >= d.kicks ? 'end' : 'aim'; if (phase === 'end') { alive = false; S.current.stop(); var won = goals >= d.winGoals; finishPlay(k, play, {}, { score: goals + '/' + d.kicks, text: function () { return won ? 'You beat the keeper! 🏆' : 'Needed ' + d.winGoals + ' goals. Try again!'; } }); return; } }
      }
      ctx.font = bs + 'px ' + EMOJI_FONT; ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.fillText('⚽', bx, by);
      // power bar
      if (phase === 'power') {
        var bw = Math.min(W - 60, 300), bxx = (W - bw) / 2, byy = H - 70, lo = (d.centre - d.powerBand / 2) / 1000, hi = (d.centre + d.powerBand / 2) / 1000, pv = power(now) / 1000;
        ctx.fillStyle = 'rgba(0,0,0,.35)'; ctx.fillRect(bxx, byy, bw, 22);
        ctx.fillStyle = '#22c55e'; ctx.fillRect(bxx + bw * lo, byy, bw * (hi - lo), 22);
        ctx.fillStyle = '#ffffff'; ctx.fillRect(bxx + bw * pv - 2, byy - 6, 4, 34);
        ctx.font = '700 13px "Plus Jakarta Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Tap to shoot — stop in the green', W / 2, byy + 44);
      } else if (phase === 'aim' && !anim) { ctx.fillStyle = '#ffffff'; ctx.font = '700 14px "Plus Jakarta Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillText('Tap a spot in the goal to aim', W / 2, H - 60); }
      // kicks log
      var lx = W / 2 - (d.kicks * 24) / 2 + 12;
      for (var b2 = 0; b2 < d.kicks; b2++) { var v = log[b2]; ctx.fillStyle = v === undefined ? 'rgba(255,255,255,.35)' : v === 'GOAL' ? '#22c55e' : '#ef4444'; ctx.beginPath(); ctx.arc(lx + b2 * 24, 24, 8, 0, Math.PI * 2); ctx.fill(); }
      if (msg) { msg.life -= dt; ctx.globalAlpha = Math.max(0, Math.min(1, msg.life * 1.6)); ctx.font = '800 ' + (msg.good ? 40 : 30) + 'px "Bricolage Grotesque", "Plus Jakarta Sans", sans-serif'; ctx.textAlign = 'center'; ctx.fillStyle = msg.good ? '#fde68a' : '#ffffff'; ctx.fillText(msg.text, W / 2, gy + gh + 70); ctx.globalAlpha = 1; if (msg.life <= 0) msg = null; }
      raf = requestAnimationFrame(frame);
    }
    raf = requestAnimationFrame(frame);
  }

  loadHome();
  // Coming back from the shop tab (e.g. after logging in) refreshes the page state.
  document.addEventListener('visibilitychange', function () { if (!document.hidden && $('gs').hidden && !S.spinning) loadHome(); });
})();
</script>
