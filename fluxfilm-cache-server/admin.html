<script>
// Installable admin app (own icon + name, opens /panel). Pages are never cached (see /sw.js).
window.ffInstall = { evt: null };
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.ffInstall.evt = e; if (window.adminInstallRefresh) adminInstallRefresh(); });
window.addEventListener('appinstalled', function () { window.ffInstall.evt = null; if (window.adminInstallRefresh) adminInstallRefresh(); if (window.toast) toast('✅ FluxFilm Admin is on your home screen'); });
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
</script>
<script>
// New-order bell: a soft "ka-ching" (Web Audio, no files) when a new paid order arrives while the panel is open.
// ffBell.on() / ffBell.set(bool) / ffBell.play(force). Silent until the first tap (browser rule); never throws.
(function () {
  var KEY = 'ff_admin_bell', ctx = null, out = null;
  function on() { try { return localStorage.getItem(KEY) !== '0'; } catch (e) { return true; } }
  function set(v) { try { localStorage.setItem(KEY, v ? '1' : '0'); } catch (e) {} }
  function resume(then) { try { var p = ctx.resume && ctx.resume(); if (p && p.then) p.then(function () { if (then && ctx.state === 'running') then(); }, function () {}); } catch (e) {} }
  function unlock() {
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext; if (!AC) return; ctx = new AC();
        // Loud but never clipping: a compressor in front of the speakers, then a strong master gain.
        var comp = ctx.createDynamicsCompressor ? ctx.createDynamicsCompressor() : null;
        out = ctx.createGain(); out.gain.value = 0.9;
        if (comp) { comp.threshold.value = -14; comp.knee.value = 6; comp.ratio.value = 8; comp.attack.value = 0.003; comp.release.value = 0.25; out.connect(comp); comp.connect(ctx.destination); }
        else out.connect(ctx.destination);
      }
      if (ctx.state !== 'running') resume();
    } catch (e) { ctx = null; }
  }
  ['pointerdown', 'touchend', 'keydown'].forEach(function (k) { window.addEventListener(k, unlock, true); });
  function tone(t, f, dur, v, type) {
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.type = type || 'sine'; o.frequency.setValueAtTime(f, t);
    g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(v, t + 0.005); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g); g.connect(out); o.start(t); o.stop(t + dur + 0.05);
  }
  function drawer(t, v) {
    // "ka": a filtered noise click like a till drawer.
    var n = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.08), ctx.sampleRate), d = n.getChannelData(0);
    for (var i = 0; i < d.length; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / d.length, 2);
    var src = ctx.createBufferSource(), bp = ctx.createBiquadFilter(), g = ctx.createGain();
    src.buffer = n; bp.type = 'bandpass'; bp.frequency.value = 2600; if (bp.Q) bp.Q.value = 0.8; g.gain.value = v;
    src.connect(bp); bp.connect(g); g.connect(out); src.start(t);
  }
  function bell(t, f, dur, v) { tone(t, f, dur, v); tone(t, f * 2.01, dur * 0.5, v * 0.3, 'triangle'); tone(t, f * 3.02, dur * 0.25, v * 0.12); }
  // New paid order: a loud ~3 s "ka-ching! ka-ching!" — drawer + bells twice, a rising sparkle, then a ringing chord.
  function kaching() {
    var t = ctx.currentTime + 0.03;
    drawer(t, 0.9);
    bell(t + 0.06, 1318.5, 0.9, 0.55);
    bell(t + 0.16, 1975.5, 1.1, 0.5);
    drawer(t + 0.55, 0.6);
    bell(t + 0.6, 1568.0, 0.8, 0.45);
    bell(t + 0.7, 2349.3, 1.0, 0.4);
    [1046.5, 1318.5, 1568.0, 2093.0].forEach(function (f, i) { bell(t + 1.15 + i * 0.12, f, 0.5, 0.35); });
    [1046.5, 1318.5, 1568.0, 2093.0].forEach(function (f) { tone(t + 1.7, f, 1.5, 0.22); tone(t + 1.7, f * 1.004, 1.5, 0.12, 'triangle'); });
  }
  function play(force) {
    try {
      if (document.hidden || !(force || on()) || !ctx) return false;
      if (ctx.state !== 'running') { resume(kaching); return false; }
      kaching();
      return true;
    } catch (e) { return false; }
  }
  window.ffBell = { on: on, set: set, play: play };
})();
</script>

<style>
/* hidden always wins over display rules (the pause bar rule display:block kept "Shop is PAUSED" visible while open) */
[hidden]{display:none!important}
:root{--brand:#e11d48;--brand2:#f43f5e;--brandbg:#fff1f2;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e5e9f0;--grid:#e3e7ee;--bg:#f3f5f9;--card:#fff;
--ok:#16a34a;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--sel:#1a73e8;--side:236px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Poppins,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit}
a{color:inherit}
.muted{color:var(--mut)}
/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
/* Phone: the dimmed area beside the open ☰ menu. Tapping it closes the menu (so do ✕, Esc, Back and a swipe left). */
.scrim{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:29;opacity:0;pointer-events:none;transition:opacity .2s}
.sidex{display:none;margin-left:auto;flex-shrink:0;border:0;background:#f1f5f9;color:#0f172a;border-radius:999px;width:38px;height:38px;font-size:1.05rem;line-height:1;cursor:pointer}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 18px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;flex-shrink:0;border-radius:22%;background:#12040a;overflow:hidden;box-shadow:0 6px 16px rgba(18,4,10,.28)}
.logo img{display:block;width:100%;height:100%}
.brand b{display:block;font-size:1.05rem}.brand small{display:block;font-size:.62rem;letter-spacing:1.6px;color:var(--mut);font-weight:600}
.menu{padding:10px 10px;overflow:auto;flex:1}
.menu h6{margin:16px 10px 6px;font-size:.64rem;letter-spacing:1.4px;color:#94a3b8;font-weight:600}
.menu a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink2);text-decoration:none;cursor:pointer;font-weight:500;margin-bottom:2px;border-left:3px solid transparent}
.menu a:hover{background:#f8fafc}
.menu a.on{background:var(--brandbg);color:var(--brand);font-weight:600;border-left-color:var(--brand)}
.menu a span{width:22px;text-align:center}
.side-install{margin:0 12px 10px;border:1.5px dashed #fda4af;background:#fff1f2;color:#be123c;border-radius:12px;padding:10px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.sidefoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:.75rem}
.main{margin-left:var(--side);min-height:100%;display:flex;flex-direction:column}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.page{padding:22px 26px;flex:1;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:1.45rem;font-weight:700}.ph p{margin:2px 0 0;color:var(--mut);font-size:.8rem}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.25)}.main{margin-left:0}.top{display:flex}.page{padding:14px}
.scrim{display:block}.scrim.on{opacity:1;pointer-events:auto}.sidex{display:block}}
/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:#f8fafc}
.btn.dark{background:#1e293b}.btn.green{background:#16a34a}.btn.wa{background:#25d366}.btn.red{background:#ef4444}.btn.purple{background:#7c3aed}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:8px}
.btn.on{background:#1e293b;color:#fff;border-color:#1e293b}
.inp{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;min-width:0}
.inp:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(244,63,94,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card h3{margin:0 0 12px;font-size:.98rem;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:600;line-height:1.6;white-space:nowrap}
.p-ok{background:var(--okbg);color:#166534}.p-warn{background:var(--warnbg);color:#92400e}.p-bad{background:var(--badbg);color:#991b1b}.p-grey{background:#eef2f7;color:#475569}.p-blue{background:#dbeafe;color:#1e40af}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;font-size:.85rem;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--brandbg)}
.kpi .n{font-size:1.4rem;font-weight:700;line-height:1.15}.kpi .l{color:var(--mut);font-size:.74rem}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.chart{position:relative;height:260px}
/* ---------- sheet grid ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs a{padding:7px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:.8rem;font-weight:500;color:var(--ink2)}
.tabs a.on{background:#1e293b;color:#fff;border-color:#1e293b}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 10px}
.toolbar .inp{padding:7px 11px;font-size:.82rem}
.fpanel{background:#fff;border:1px solid var(--line);border-bottom:0;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#fpanel{display:block;background:#fbfcfe}.fpanel[hidden],#fpanel[hidden]{display:none}
.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.frow .inp{padding:6px 9px;font-size:.8rem}.frow .grow{flex:1;min-width:120px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:.76rem;cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip.on{background:#1e293b;border-color:#1e293b;color:#fff}.chip b{cursor:pointer;margin-left:4px;opacity:.8}.chip.clear{color:var(--bad);border-color:#fecaca}
.fbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-bottom:0;padding:5px 10px;font-size:.8rem;min-height:34px}
.fbar .fx{color:#94a3b8;font-style:italic;font-weight:600;border-right:1px solid var(--line);padding-right:8px}
.fbar .fname{font-weight:600;color:var(--ink2);min-width:90px}
.fbar .fval{flex:1;font-family:Consolas,monospace;white-space:nowrap;overflow:auto;color:var(--ink)}
.gridwrap{background:#fff;border:1px solid var(--line);overflow:auto;height:calc(100vh - 300px);min-height:320px;position:relative}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px}
.sheet th,.sheet td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0 8px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:middle;background:#fff}
.sheet.comfy th,.sheet.comfy td{height:40px;padding:0 12px;font-size:13px}
.sheet.wrap td{white-space:normal;word-break:break-word;height:auto;padding-top:5px;padding-bottom:5px}
.sheet th{position:sticky;top:0;z-index:3;background:#f5f7fa;color:#475569;font-weight:600;font-size:11.5px;user-select:none;cursor:pointer}
.sheet th:hover{background:#edf1f6}
.sheet th .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:4}
.sheet th .rz:hover,.sheet th .rz.drag{background:var(--sel)}
.sheet th .ar{color:var(--sel);margin-left:4px}
.sheet .rn{position:sticky;left:0;z-index:2;background:#f5f7fa;color:#94a3b8;text-align:center;font-size:11px;padding:0 2px}
.sheet th.rn{z-index:5}
.sheet .c1{position:sticky;left:46px;z-index:2;box-shadow:1px 0 0 var(--grid)}
.sheet th.c1{z-index:5}
.sheet tbody tr:hover td{background:#f8fbff}
.sheet tbody tr:hover td.rn{background:#eef2f7}
.sheet td.sel{outline:2px solid var(--sel);outline-offset:-2px;background:#eef5ff !important}
.sheet tr.rsel td.rn{background:#dbe7fb;color:var(--sel);font-weight:700}
.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet .edit{border:0;background:transparent;cursor:pointer;color:#94a3b8;font-size:12px;padding:0 2px}
.sheet .edit:hover{color:var(--sel)}
.sheet input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--brand);vertical-align:middle;margin:0}
.sheet .celllink{cursor:pointer;text-decoration:underline dotted #94a3b8}
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:8px 12px;font-size:.8rem}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(15,23,42,.16);padding:8px;z-index:40;max-height:360px;overflow:auto;min-width:230px}
.ddm label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:7px;font-size:.8rem;cursor:pointer}
.ddm label:hover{background:#f5f7fa}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:30px 14px}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:720px;box-shadow:0 25px 80px rgba(15,23,42,.35);overflow:hidden}
.mbox.small{max-width:420px}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.mhd b{font-size:1rem}
.mbody{padding:16px 20px;max-height:66vh;overflow:auto}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.fields{grid-template-columns:1fr}}
.fld label{display:block;font-size:.68rem;color:var(--mut);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fld .inp{width:100%}.fld.key .inp{background:#f1f5f9;border-style:dashed}
.mft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---------- customer 360 ---------- */
.search{display:flex;gap:10px;margin-bottom:16px}.search .inp{flex:1;padding:12px 16px;font-size:.95rem}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#fb7185);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:700;flex-shrink:0}
.prof h2{margin:0;font-size:1.25rem}
.stats{display:flex;gap:26px;margin-top:10px;flex-wrap:wrap}.stats b{display:block;font-size:1.2rem}.stats small{color:var(--mut);font-size:.72rem}
.subhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;flex-wrap:wrap;gap:8px}
.subhead h3{margin:0;font-size:1rem}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,420px),1fr));gap:14px}@media(max-width:520px){.subs{grid-template-columns:minmax(0,1fr)}}
.sc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.sc.exp{background:#fcfcfd}
.sc .hd{display:flex;gap:12px;align-items:flex-start}
.sc .sic{width:40px;height:40px;border-radius:11px;background:#f5f7fa;display:grid;place-items:center;font-size:1.15rem;flex-shrink:0}
.sc .ttl{flex:1;min-width:0}.sc .ttl b{display:block;font-size:.98rem}.sc .ttl small{color:var(--mut)}
.sc .rt{text-align:right;font-size:.72rem;color:var(--mut)}
.bar{height:5px;background:#eef2f7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a)}
.bar.w i{background:linear-gradient(90deg,#f59e0b,#d97706)}.bar.b i{background:#ef4444}
.creds{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:4px 12px}
.cr{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.8rem;border-bottom:1px dashed #e5e9f0}.cr:last-child{border-bottom:0}
.cr span{color:var(--mut);width:74px;flex-shrink:0}.cr code{flex:1;min-width:0;font-family:Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cr .copy{flex-shrink:0}
/* Customer 360 on phones: no sideways scroll, 2×2 stats, full-width actions (owner report 2026-09-15) */
.prof .pinfo{flex:1;min-width:220px}.prof .pinfo .muted{overflow-wrap:anywhere}
@media(max-width:600px){
  .prof{align-items:flex-start;gap:14px}.prof .avatar{width:52px;height:52px;font-size:1.1rem}
  .prof .pinfo{min-width:0;flex-basis:calc(100% - 66px)}
  .stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px 16px;margin-top:14px;padding-top:12px;border-top:1px solid var(--line)}
  .pact{width:100%;display:grid !important;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
  .pact .btn{justify-content:center;min-height:44px;padding:10px 8px}.pact .wa{grid-column:1/-1}
  .sc{padding:14px}.sc .hd{flex-wrap:wrap}.sc .rt{margin-left:auto}
  .cr span{width:64px}
}
.copy{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:.7rem;padding:2px 8px;cursor:pointer}
.rmbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:11px;background:#fff7ed;border:1px solid #fed7aa;font-size:.8rem}
.rmbox.off{background:#f8fafc;border-color:var(--line)}
.rmbox input[type=datetime-local]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:.78rem}
.rmbox input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.7rem}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #f1f4f8;font-size:.84rem;flex-wrap:wrap}.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:160px}
/* ---------- quick orders ---------- */
.qtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.qtabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;color:var(--ink2)}
.qtabs button.on{background:#1e293b;color:#fff;border-color:#1e293b}
.qgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.qgrid{grid-template-columns:1fr}}

.ff-promo { position: relative; overflow: hidden; color: #fff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }

.ff-promo.t-green { background: linear-gradient(120deg, #15803d, #16a34a 50%, #34d399); }
.ff-promo.t-red { background: linear-gradient(120deg, #b91c1c, #dc2626 50%, #f97316); }
.ff-promo.t-purple { background: linear-gradient(120deg, #3730a3, #6d28d9 55%, #a855f7); }
.ff-promo.t-dark { background: linear-gradient(120deg, #0f172a, #1e293b 60%, #334155); color: #fde68a; }
.ff-promo.t-gold { background: linear-gradient(120deg, #f59e0b, #fbbf24 55%, #fde68a); color: #3b2300; }
.ff-promo-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 0 0 12px; padding: 10px 40px 10px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.4; box-shadow: 0 6px 18px rgba(15,23,42,.14); }
.ff-promo-emoji { font-size: 20px; }
.ff-promo-text { flex: 1 1 180px; }
.ff-promo-text b { font-weight: 900; }
.ff-promo-timer { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.2); font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ff-promo-code { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1.5px dashed currentColor; border-radius: 10px; background: rgba(255,255,255,.14); color: inherit; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.ff-promo-code span { font-size: 10px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
.ff-promo-code b { font-weight: 900; letter-spacing: .06em; }
.ff-promo-cta { border: 0; border-radius: 999px; padding: 7px 14px; background: #fff; color: #0f172a; font: inherit; font-size: 13px; font-weight: 900; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.15); }
.ff-promo.t-gold .ff-promo-cta { background: #3b2300; color: #fde68a; }
.ff-promo-cta.big { width: 100%; padding: 14px 18px; font-size: 16px; margin-top: 12px; }
.ff-promo-x { position: absolute; top: 8px; right: 8px; width: 28px; height: 28px; border: 0; border-radius: 50%; background: rgba(255,255,255,.22); color: inherit; font-size: 18px; line-height: 1; cursor: pointer; z-index: 2; }
.ff-promo-card { display: flex; gap: 14px; align-items: center; margin: 0 0 16px; padding: 18px; border-radius: 22px; box-shadow: 0 14px 34px rgba(109,40,217,.22); }
.ff-promo-glow { position: absolute; inset: -40% -20% auto auto; width: 70%; height: 140%; background: radial-gradient(closest-side, rgba(255,255,255,.35), transparent); animation: ffPromoGlow 6s ease-in-out infinite alternate; pointer-events: none; }
.ff-promo-big { font-size: 56px; line-height: 1; flex: none; animation: ffPromoBounce 2.6s ease-in-out infinite; }
.ff-promo-img { width: 96px; height: 96px; object-fit: cover; border-radius: 16px; flex: none; }
.ff-promo-body { position: relative; flex: 1; min-width: 0; }
.ff-promo-title { font-size: 20px; font-weight: 900; line-height: 1.2; }
.ff-promo-msg { margin-top: 4px; font-size: 14px; font-weight: 600; line-height: 1.45; opacity: .95; }
.ff-promo-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; align-items: center; }
.ff-promo-row.center { justify-content: center; }
@media (max-width: 520px) { .ff-promo-card { flex-direction: column; text-align: center; } .ff-promo-card .ff-promo-row { justify-content: center; } .ff-promo-img { width: 100%; height: 150px; } }
.ff-promo-bg { position: fixed; inset: 0; z-index: 75; display: grid; place-items: center; padding: 16px; background: rgba(15,23,42,.45); animation: ffInstallFade .2s ease both; }
.ff-promo-pop { width: 100%; max-width: 380px; padding: 26px 20px 16px; border-radius: 26px; text-align: center; box-shadow: 0 30px 70px rgba(15,23,42,.4); animation: ffPromoPop .4s cubic-bezier(.2,.9,.3,1.25) both; }
.ff-promo-pop .ff-promo-big { font-size: 72px; margin: 0 auto 10px; }
.ff-promo-pop .ff-promo-img { width: 100%; height: 170px; margin-bottom: 12px; }
.ff-promo-pop .ff-promo-title { font-size: 24px; }
.ff-promo-later { display: block; margin: 10px auto 0; border: 0; background: none; color: inherit; opacity: .85; font: inherit; font-size: 13px; font-weight: 700; text-decoration: underline; cursor: pointer; }
@keyframes ffPromoPop { from { transform: perspective(700px) rotateX(18deg) translateY(30px) scale(.92); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes ffPromoBounce { 0%, 100% { transform: translateY(0) rotate(-4deg); } 50% { transform: translateY(-6px) rotate(4deg); } }
@keyframes ffPromoGlow { from { transform: translateX(0); opacity: .6; } to { transform: translateX(-30%); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .ff-promo-pop, .ff-promo-big, .ff-promo-glow, .ff-promo-bg { animation: none; } }

// removed by 2.6 s at the latest. The panel renders underneath.
// Sound: a whoosh as the ribbons unfurl, a soft two-note chime when the logo locks in, a short whoosh on the dive.
// Synthesized with Web Audio (no file). Browsers only allow it once the site may play sound (e.g. installed app or
// a returning visitor); otherwise the splash just plays silently.
(function () {

  } catch (e) {}

      chime(t0 + 0.84, 659.25, 0.22);

function attachCustomerSearch(input, onPick, onEnter) {
  var wrap = document.createElement('div'); wrap.className = 'qsearch'; input.parentNode.insertBefore(wrap, input); wrap.appendChild(input);
  var drop = document.createElement('div'); drop.className = 'qdrop'; drop.hidden = true; wrap.appendChild(drop);
  var tmr, results = [], last = '';

    clearTimeout(tmr);
    var q = input.value.trim();
    if (q.length < 2) { drop.hidden = true; return; }
    tmr = setTimeout(function () {
      last = q;

    if (e.key === 'Enter') { drop.hidden = true; onEnter && onEnter(input.value.trim(), results); }

}

/* ================= extend a subscription ================= */
function extendDialog(subId) {
  var sub = ((S.cust && S.cust.subs) || []).find(function (x) { return x.sub_id === subId; }) || { sub_id: subId };
  var preview = function (days) {
    var e = istDate(sub.expiry_date); if (!e || !days) return '';
    var n = new Date(e.getTime() + days * 86400000), p = new Date(n.getTime() + 5.5 * 3600e3);
    return 'New expiry: <b>' + p.getUTCDate() + ' ' + MON[p.getUTCMonth()] + ' ' + p.getUTCFullYear() + '</b>';
  };
  modal('⏱ Extend ' + esc(sub.service || subId),
    '<p class="muted" style="margin-top:0;font-size:.82rem">' + esc(sub.plan || '') + ' · ' + esc(subId) + ' · ends ' + prettyDate(sub.expiry_date, true) + '</p>' +
    '<div class="fld"><label>Days (use a minus to take days off)</label><div class="row"><input class="inp" id="exd" type="number" value="2" style="width:100px"/>' + [1, 2, 3, 7, 30].map(function (n) { return '<button class="chip" data-d="' + n + '">+' + n + '</button>'; }).join('') + '</div></div>' +
    '<div class="qnote" id="exprev">' + preview(2) + '</div>' +
    '<div class="fld" style="margin-top:12px"><label>Reason (saved in the change log)</label><input class="inp" id="exr" placeholder="e.g. Netflix not working 12–14 Sep"/><div class="row" style="margin-top:6px">' + ['Service not working', 'Goodwill', 'Late delivery', 'Wrong login given'].map(function (x) { return '<button class="chip" data-r="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div></div>',
    '<button class="btn green" id="exgo">⏱ Save</button><span id="exmsg" class="muted"></span>', 'small');
  var box = $('#modal');
  box.addEventListener('click', function (e) {
    var dd = e.target.closest('[data-d]'), rr = e.target.closest('[data-r]');
    if (dd) { $('#exd').value = dd.getAttribute('data-d'); $('#exprev').innerHTML = preview(+$('#exd').value); }
    if (rr) $('#exr').value = rr.getAttribute('data-r');
  });
  $('#exd').addEventListener('input', function () { $('#exprev').innerHTML = preview(parseInt($('#exd').value, 10) || 0); });
  $('#exgo').onclick = function () {
    var days = parseInt($('#exd').value, 10), reason = $('#exr').value.trim();
    if (!days) { $('#exmsg').textContent = 'Enter the number of days.'; return; }
    if (!reason) { $('#exmsg').textContent = 'Add a short reason.'; $('#exr').focus(); return; }
    $('#exgo').disabled = true; $('#exmsg').textContent = 'Saving…';
    post('/admin/api/subs/extend', { subId: subId, days: days, reason: reason }).then(function (r) {
      if (!r.ok) { $('#exgo').disabled = false; $('#exmsg').textContent = '⚠️ ' + (r.message || 'failed'); return; }
      closeModal(); toast('⏱ ' + (days > 0 ? '+' : '') + days + ' day(s) · now ends ' + prettyDate(r.after.expiry));
      if (typeof lookup === 'function' && $('#cp')) lookup();
    });
  };
}

    '<p class="muted" style="font-size:.84rem">Daily backups are encrypted with this (AES-256-GCM). The passphrase itself is not stored and is never shown again. <b>Write it down somewhere safe</b> — without it a backup cannot be opened. Changing it only affects new backups (old files still need the old passphrase).</p>' +
    (b.set ? '<p style="font-size:.86rem">Set ' + nxWhen(b.setAt) + ' · check code <code>' + esc(b.check) + '</code></p>' : '') +
    '<div class="row" style="gap:8px;flex-wrap:wrap"><input class="inp" id="nxpass" type="password" autocomplete="new-password" minlength="12" placeholder="At least 12 characters" style="flex:1;min-width:200px"/><button class="btn green" id="nxpasssave">💾 ' + (b.set ? 'Change' : 'Set') + ' passphrase</button>' + (b.set ? '<button class="btn ghost" id="nxpassclear">Remove</button>' : '') + '</div></div>' +

    '<div class="card"><h3 style="margin-top:0">🎁 Win-back coupons</h3><p class="muted" style="font-size:.84rem">A personal, one-use coupon (only that customer’s phone, new or renew) is made when n8n asks for win-back customers. Customers who unsubscribed from offers are never included, and nobody gets the same campaign twice in 60 days.</p>' + wbRows +
    '<div class="rf-save"><button class="btn green" id="nxwbsave">💾 Save coupons</button><span class="rf-state" id="nxwbstate"></span></div></div>' +

    '<div class="card"><h3 style="margin-top:0">📚 For n8n</h3><p class="muted" style="font-size:.84rem">Base: <code>' + esc(d.site) + '</code> · header <code>X-N8N-Key</code></p><ul style="margin:0;padding-left:18px;font-size:.84rem">' + (d.endpoints || []).map(function (e) { return '<li><code>' + esc(e) + '</code></li>'; }).join('') + '</ul>' +
    '<p class="muted" style="font-size:.8rem;margin-bottom:0">Webhook check: last run ' + nxWhen(d.hooks && d.hooks.lastSweepAt) + (d.hooks && d.hooks.lastSweepError ? ' · ⚠️ ' + esc(d.hooks.lastSweepError) : '') + '</p></div>';

  $('#nxkeygen').onclick = function () {
    if (k.set && !confirm('Make a new key? The old key stops working at once — update the n8n credential right after.')) return;
    post('/admin/api/n8n/key', { action: 'generate' }).then(function (r) {
      if (!r.ok) return toast('⚠️ ' + (r.message || 'failed'));
      nxOnce('🔑 Your n8n API key', r.key, 'In n8n: Credentials → New → <b>Header Auth</b> → Name <code>X-N8N-Key</code>, Value = this key. Name the credential <b>FluxFilm n8n key</b>.');
      nxLoad();
    });
  };
  var rev = $('#nxkeyrev'); if (rev) rev.onclick = function () { if (!confirm('Revoke the n8n key? Every n8n workflow calling the shop stops until you make a new key.')) return; post('/admin/api/n8n/key', { action: 'revoke' }).then(function (r) { toast(r.ok ? 'Key revoked' : '⚠️ ' + (r.message || 'failed')); nxLoad(); }); };
  $('#nxsave').onclick = function () {
    var ev = {}; $('[data-nxev]').forEach(function (c) { ev[c.getAttribute('data-nxev')] = c.checked; });
    $('#nxstate').textContent = 'Saving…';
    post('/admin/api/n8n/settings', { webhookUrl: $('#nxurl').value.trim(), events: ev }).then(function (r) {
      if (!r.ok) { $('#nxstate').textContent = '⚠️ ' + (r.message || 'failed'); return; }

    });
  };
  $('#nxsecret').onclick = function () {
    if (d.secretSet && !confirm('Make a new signing secret? n8n must be updated or it will reject the webhooks.')) return;
    post('/admin/api/n8n/secret', {}).then(function (r) {
      if (!r.ok) return toast('⚠️ ' + (r.message || 'failed'));
      nxOnce('🔏 Webhook signing secret', r.secret, 'In n8n, paste it into the <b>Crypto</b> node “Secret” of the social post workflow (or a variable) so n8n can check the <b>X-FF-Signature</b> header.');
      nxLoad();
    });
  };
  $('#nxtest').onclick = function () {
    var btn = this; btn.disabled = true;
    post('/admin/api/n8n/test-webhook', {}).then(function (r) {
      btn.disabled = false;
      toast(r.ok ? '✅ n8n answered HTTP ' + r.status : '⚠️ ' + (r.message || r.error || ('HTTP ' + r.status)));
      nxLoad();
    });
  };
  $('#nxpasssave').onclick = function () {
    var v = $('#nxpass').value;
    if (v.length < 12) return toast('Use at least 12 characters');
    if (b.set && !confirm('Change the backup passphrase? New backups use the new one; old backup files still need the old one.')) return;
    post('/admin/api/n8n/passphrase', { passphrase: v }).then(function (r) { $('#nxpass').value = ''; toast(r.ok ? '✅ Passphrase saved — write it down' : '⚠️ ' + (r.message || 'failed')); nxLoad(); });
  };
  var pc = $('#nxpassclear'); if (pc) pc.onclick = function () { if (!confirm('Remove the backup passphrase? Backups are refused until you set a new one.')) return; post('/admin/api/n8n/passphrase', { clear: true }).then(function (r) { toast(r.ok ? 'Removed' : '⚠️ ' + (r.message || 'failed')); nxLoad(); }); };
  $('#nxwbsave').onclick = function () {
    var w = {}; $('[data-wb]').forEach(function (el) { var c = el.getAttribute('data-wb'); w[c] = w[c] || {}; w[c][el.getAttribute('data-f')] = el.value; });
    $('#nxwbstate').textContent = 'Saving…';
    post('/admin/api/n8n/settings', { winback: w }).then(function (r) {
      if (!r.ok) { $('#nxwbstate').textContent = '⚠️ ' + (r.message || 'failed'); return; }
      NX.d = r; nxRender(); toast('✅ Saved');
    });
  };
}

<script>
/* ================= 📤 exports: orders + customers to Excel / CSV (adminexports.js) ================= */
// Self-contained: adds the 📤 Exports menu item + screen here, so the main menu line stays untouched.
// Downloads use fetch (session cookie) + Blob + <a download> — the admin key is never put in a URL.
var EXP = { opts: null };
(function () {
  if (!MENU.some(function (m) { return m[0] === 'exports'; })) {
    var at = -1; MENU.forEach(function (m, i) { if (m[0] === 'audit') at = i; });
    MENU.splice(at >= 0 ? at : MENU.length, 0, ['exports', '📤', 'Exports']);
  }
  var baseViewMap = viewMap;
  viewMap = function () { var m = baseViewMap(); m.exports = exportsView; return m; };
})();
var EX_PRIVATE = '🔒 Contains customer phone numbers and emails — keep this file private.';
function exportsView() {
  $('#view').innerHTML = '<div class="ph"><div><h1>📤 Exports</h1><p>Download the orders list or customer profiles as an Excel file (.xlsx) or CSV</p></div></div>' +
    '<div class="card"><h3 style="margin-top:0">🧾 Orders</h3><p class="muted" style="margin-top:0">Date range, status, service, plan, payment, delivery, coupon, refunds. Includes a Summary sheet (totals, by service, by status).</p><button class="btn" onclick="exOrdersDialog({})">⬇️ Export orders</button></div>' +
    '<div class="card"><h3 style="margin-top:0">👥 Customers</h3><p class="muted" style="margin-top:0">Joined date, active / expired / never bought, service used, email, total spent. One row per customer with orders, plans, coins, referrals, refunds and credit.</p><button class="btn" onclick="exCustomersDialog({})">⬇️ Export customers</button></div>' +
    '<p class="muted" style="font-size:.8rem">' + EX_PRIVATE + ' Every export is written to the 🕘 Change log. At most 50,000 rows per file and 20 exports every 10 minutes.</p>';
}
function exOptions() {
  if (EXP.opts) return Promise.resolve(EXP.opts);
  return api('/admin/api/exports/options').then(function (r) { if (r && r.ok) EXP.opts = r; return r || { ok: false }; });
}
function exChips(id, items, selected, multi) {
  return '<div class="row" style="gap:6px" id="' + id + '" data-multi="' + (multi ? 1 : 0) + '">' + items.map(function (it) {
    return '<button type="button" class="chip' + (selected.indexOf(it[0]) >= 0 ? ' on' : '') + '" data-v="' + esc(it[0]) + '">' + esc(it[1]) + '</button>';
  }).join('') + '</div>';
}
function exWireChips(id, onChange) {
  var box = $('#' + id); if (!box) return;
  box.onclick = function (e) {
    var b = e.target.closest('[data-v]'); if (!b) return;
    if (box.getAttribute('data-multi') === '1') b.classList.toggle('on');
    else $$('#' + id + ' [data-v]').forEach(function (x) { x.classList.toggle('on', x === b); });
    if (onChange) onChange();
  };
}
function exVals(id) { return $$('#' + id + ' .chip.on').map(function (b) { return b.getAttribute('data-v'); }); }
function exVal(id) { return exVals(id)[0] || ''; }
var EX_DATES = [['all', 'All dates'], ['today', 'Today'], ['yesterday', 'Yesterday'], ['this_week', 'This week'], ['last7', 'Last 7 days'], ['this_month', 'This month'], ['last_month', 'Last month'], ['custom', 'Custom…']];
function exDateHtml(prefix, preset) {
  return '<div class="fld" style="grid-column:1/-1"><label>' + (prefix === 'exc' ? 'Joined' : 'Date') + ' (India time)</label>' + exChips(prefix + '_date', EX_DATES, [preset || 'all'], false) +
    '<div class="row" id="' + prefix + '_custom" style="margin-top:8px"' + (preset === 'custom' ? '' : ' hidden') + '><input class="inp" type="date" id="' + prefix + '_from"/> to <input class="inp" type="date" id="' + prefix + '_to"/></div></div>';
}
function exFormatHtml(prefix) {
  return '<div class="fld" style="grid-column:1/-1"><label>File type</label>' + exChips(prefix + '_fmt', [['xlsx', '📗 Excel (.xlsx)'], ['csv', '📄 CSV (UTF-8)']], ['xlsx'], false) + '</div>';
}
function exSave(blob, name) {
  var url = URL.createObjectURL(blob);
  var a = document.createElement('a'); a.href = url; a.download = name; a.style.display = 'none';
  document.body.appendChild(a); a.click();
  setTimeout(function () { URL.revokeObjectURL(url); a.remove(); }, 5000);
}
/** POST the filters; a file comes back as a Blob and is saved; a JSON answer is an error (limit, rate limit, sign-in). */
function exDownload(kind, body, btn, msg) {
  btn.disabled = true; msg.textContent = '⏳ Making the file…';
  fetch('/admin/api/exports/' + kind, { method: 'POST', credentials: 'same-origin', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) }).then(function (r) {
    var ct = r.headers.get('Content-Type') || '';
    if (!r.ok || /json/i.test(ct)) {
      return r.json().catch(function () { return { message: 'Export failed (' + r.status + ')' }; }).then(function (d) {
        if (d && d.needLogin) { closeModal(); loginView('Your session ended — please sign in again.'); return; }
        btn.disabled = false; msg.innerHTML = '<span style="color:var(--bad)">' + esc((d && d.message) || 'Export failed') + '</span>';
      });
    }
    var name = r.headers.get('X-Export-Filename') || ('FluxFilm-' + kind + '.' + (body.format === 'csv' ? 'csv' : 'xlsx'));
    var rows = r.headers.get('X-Export-Rows') || '';
    return r.blob().then(function (b) {
      exSave(b, name);
      btn.disabled = false;
      msg.innerHTML = '✅ ' + esc(name) + (rows ? ' · ' + Number(rows).toLocaleString('en-IN') + ' rows' : '');
      toast('⬇️ Downloaded ' + name);
    });
  }).catch(function (e) { btn.disabled = false; msg.innerHTML = '<span style="color:var(--bad)">' + esc(e.message || 'Export failed') + '</span>'; });
}
function exCount(kind, body, el) {
  el.textContent = 'Counting…';
  var my = (EXP.countSeq = (EXP.countSeq || 0) + 1);
  post('/admin/api/exports/' + kind + '/count', body).then(function (r) {
    if (my !== EXP.countSeq || !el) return;
    if (!r || !r.ok) { el.textContent = (r && r.message) || ''; return; }
    var what = kind === 'orders' ? 'orders' : 'customers';
    el.innerHTML = r.tooMany ? '<span style="color:var(--bad)">⚠️ ' + r.count.toLocaleString('en-IN') + ' ' + what + ' match — the limit is ' + r.limit.toLocaleString('en-IN') + '. Pick a shorter date range.</span>'
      : '📊 ' + (r.exact ? '' : 'Up to ') + '<b>' + r.count.toLocaleString('en-IN') + '</b> ' + what + (r.exact ? ' will be exported' : ' before the payment / refund / plan filters') + ' · <span class="muted">' + esc(r.fileName) + '</span>';
  });
}
function exDateBody(prefix) {
  var p = exVal(prefix + '_date') || 'all';
  return { date: p, from: p === 'custom' ? ($('#' + prefix + '_from').value || '') : '', to: p === 'custom' ? ($('#' + prefix + '_to').value || '') : '' };
}
function exOrdersDialog(pre) {
  pre = pre || {};
  // The Orders screen's current view becomes the starting filters.
  var v = pre.view || 'all';
  var st = v === 'unpaid' ? ['created'] : v === 'undelivered' ? ['paid'] : [];
  var dl = v === 'undelivered' ? ['failed', 'pending'] : v === 'manual' ? ['manual'] : [];
  var preset = v === 'today' ? 'today' : v === 'week' ? 'last7' : 'all';
  modal('⬇️ Export orders', '<p class="muted">Loading…</p>', '', '');
  exOptions().then(function (o) {
    if (!$('#modal')) return;
    var services = (o && o.services) || [];
    var methods = (o && o.methods) || {};
    var paidViaOpts = (o && o.paidVia) || {};
    var body = '<div data-nodirty="1"><div class="fields">' + exDateHtml('exo', preset) +
      '<div class="fld" style="grid-column:1/-1"><label>Status</label>' + exChips('exo_st', [['paid', 'Paid'], ['created', 'Created (not paid)'], ['pending', 'Pending'], ['credit', 'On credit'], ['written_off', 'Credit written off'], ['refunded', 'Refunded'], ['failed', 'Failed / cancelled']], st, true) + '</div>' +
      '<div class="fld" style="grid-column:1/-1"><label>Type</label>' + exChips('exo_type', [['new', 'New'], ['renewal', 'Renewal']], [], true) + '</div>' +
      '<div class="fld" style="grid-column:1/-1"><label>Service</label>' + (services.length ? exChips('exo_svc', services.map(function (x) { return [x, x]; }), [], true) : '<span class="muted">No services found</span>') + '</div>' +
      '<div class="fld"><label>Plan</label><select class="inp" id="exo_plan"><option value="">All plans</option></select></div>' +
      '<div class="fld"><label>Has coupon</label>' + exChips('exo_cpn', [['', 'Any'], ['yes', 'Yes'], ['no', 'No']], [''], false) + '</div>' +
      '<div class="fld" style="grid-column:1/-1"><label>Payment method</label>' + exChips('exo_pm', Object.keys(methods).map(function (k) { return [k, methods[k]]; }), [], true) + '</div>' +
      // 💸 Which QR / route the money came through (paidvia.js) — its own column in the file too.
      '<div class="fld" style="grid-column:1/-1"><label title="' + esc(PV_TIP) + '">Paid via (website QR / backup QR) ⓘ</label>' + exChips('exo_pv', Object.keys(paidViaOpts).map(function (k) { return [k, paidViaOpts[k]]; }), pre.paidVia ? [pre.paidVia] : [], true) + '</div>' +
      '<div class="fld" style="grid-column:1/-1"><label>Delivery status</label>' + exChips('exo_dl', [['fulfilled', 'Delivered'], ['manual', 'Manual — to activate'], ['failed', 'Failed'], ['pending', 'Not delivered yet']], dl, true) + '</div>' +
      '<div class="fld"><label>Refund</label><select class="inp" id="exo_rf"><option value="">Any order</option><option value="any">Only refunded</option><option value="none">Not refunded</option><option value="UPI">Refunded by UPI</option><option value="UPI_PENDING">UPI refund waiting</option><option value="CREDIT">Refund credit / coins</option><option value="COUPON">Refund coupon</option></select></div>' +
      '<div class="fld"><label>Search (phone / name / order id)</label><input class="inp" id="exo_q" value="' + esc(pre.q || '') + '"/></div>' +
      exFormatHtml('exo') + '</div>' +
      '<p id="exo_count" style="font-size:.85rem;margin:10px 0 4px"></p>' +
      '<p style="font-size:.8rem;background:#fef3c7;color:#92400e;padding:8px 10px;border-radius:8px;margin:6px 0 0">' + EX_PRIVATE + '</p></div>';
    $('#modal .mbody').innerHTML = body;
    $('#modal .mft').innerHTML = '<button class="btn green" id="exo_go">⬇️ Download</button><span id="exo_msg" class="muted" style="font-size:.8rem"></span>';
    var plans = (o && o.plans) || [];
    var fillPlans = function () {
      var chosen = exVals('exo_svc'); var sel = $('#exo_plan'); if (!sel) return; var cur = sel.value;
      var list = plans.filter(function (p) { return !chosen.length || chosen.indexOf(p.service) >= 0; }).map(function (p) { return p.plan; }).filter(function (x, i, a) { return x && a.indexOf(x) === i; });
      sel.innerHTML = '<option value="">All plans</option>' + list.map(function (p) { return '<option' + (p === cur ? ' selected' : '') + '>' + esc(p) + '</option>'; }).join('');
    };
    var build = function () {
      var d = exDateBody('exo');
      return { format: exVal('exo_fmt') || 'xlsx', filters: { date: d.date, from: d.from, to: d.to, statuses: exVals('exo_st'), types: exVals('exo_type'), services: exVals('exo_svc'), plan: $('#exo_plan').value, hasCoupon: exVal('exo_cpn'), methods: exVals('exo_pm'), paidVia: exVals('exo_pv'), delivery: exVals('exo_dl'), refundKinds: $('#exo_rf').value ? [$('#exo_rf').value] : [], q: $('#exo_q').value.trim() } };
    };
    var t; var recount = function () { clearTimeout(t); t = setTimeout(function () { if ($('#exo_count')) exCount('orders', build(), $('#exo_count')); }, 300); };
    ['exo_st', 'exo_type', 'exo_cpn', 'exo_pm', 'exo_pv', 'exo_dl', 'exo_fmt'].forEach(function (id) { exWireChips(id, recount); });
    exWireChips('exo_svc', function () { fillPlans(); recount(); });
    exWireChips('exo_date', function () { $('#exo_custom').hidden = exVal('exo_date') !== 'custom'; recount(); });
    ['exo_plan', 'exo_rf', 'exo_from', 'exo_to'].forEach(function (id) { $('#' + id).addEventListener('change', recount); });
    $('#exo_q').addEventListener('input', recount);
    fillPlans(); recount();
    $('#exo_go').onclick = function () { exDownload('orders', build(), $('#exo_go'), $('#exo_msg')); };
  });
}
function exCustomersDialog() {
  modal('⬇️ Export customers', '<p class="muted">Loading…</p>', '', '');
  exOptions().then(function (o) {
    if (!$('#modal')) return;
    var services = (o && o.services) || [];
    $('#modal .mbody').innerHTML = '<div data-nodirty="1"><div class="fields">' + exDateHtml('exc', 'all') +
      '<div class="fld" style="grid-column:1/-1"><label>Plans</label>' + exChips('exc_plan', [['', 'Everyone'], ['active', 'Has an active plan'], ['expired', 'Expired only'], ['never', 'Never bought']], [''], false) + '</div>' +
      '<div class="fld" style="grid-column:1/-1"><label>Service used</label>' + (services.length ? exChips('exc_svc', services.map(function (x) { return [x, x]; }), [], true) : '<span class="muted">No services found</span>') + '</div>' +
      '<div class="fld"><label>Email</label>' + exChips('exc_em', [['', 'Any'], ['yes', 'Has email'], ['no', 'No email']], [''], false) + '</div>' +
      '<div class="fld"><label>Total spent at least (₹)</label><input class="inp" id="exc_min" inputmode="decimal" placeholder="0"/></div>' +
      '<div class="fld" style="grid-column:1/-1"><label>Search (phone / name / email / customer id)</label><input class="inp" id="exc_q"/></div>' +
      exFormatHtml('exc') + '</div>' +
      '<p class="muted" style="font-size:.75rem;margin:6px 0 0">City / state are not saved for customers, so there is no filter for them. Passwords, OTPs, logins and sessions are never exported.</p>' +
      '<p id="exc_count" style="font-size:.85rem;margin:10px 0 4px"></p>' +
      '<p style="font-size:.8rem;background:#fef3c7;color:#92400e;padding:8px 10px;border-radius:8px;margin:6px 0 0">' + EX_PRIVATE + '</p></div>';
    $('#modal .mft').innerHTML = '<button class="btn green" id="exc_go">⬇️ Download</button><span id="exc_msg" class="muted" style="font-size:.8rem"></span>';
    var build = function () {
      var d = exDateBody('exc');
      return { format: exVal('exc_fmt') || 'xlsx', filters: { date: d.date, from: d.from, to: d.to, planState: exVal('exc_plan'), services: exVals('exc_svc'), hasEmail: exVal('exc_em'), minSpent: $('#exc_min').value.trim(), q: $('#exc_q').value.trim() } };
    };
    var t; var recount = function () { clearTimeout(t); t = setTimeout(function () { if ($('#exc_count')) exCount('customers', build(), $('#exc_count')); }, 300); };
    ['exc_plan', 'exc_svc', 'exc_em', 'exc_fmt'].forEach(function (id) { exWireChips(id, recount); });
    exWireChips('exc_date', function () { $('#exc_custom').hidden = exVal('exc_date') !== 'custom'; recount(); });
    ['exc_from', 'exc_to'].forEach(function (id) { $('#' + id).addEventListener('change', recount); });
    ['exc_min', 'exc_q'].forEach(function (id) { $('#' + id).addEventListener('input', recount); });
    recount();
    $('#exc_go').onclick = function () { exDownload('customers', build(), $('#exc_go'), $('#exc_msg')); };
  });
}
