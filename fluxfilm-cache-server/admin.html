<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/><title>FluxFilm Admin</title>
<link rel="manifest" href="/panel.webmanifest"/>
<meta name="theme-color" content="#12040a"/>
<link rel="icon" type="image/png" href="/icons/admin-icon-192.png"/>
<link rel="apple-touch-icon" href="/icons/admin-apple-touch-icon-180.png"/>
<link rel="preload" as="image" type="image/svg+xml" href="/icons/admin-logo.svg"/>
<meta name="apple-mobile-web-app-capable" content="yes"/><meta name="mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="FF Admin"/>
<script>
// Installable admin app (own icon + name, opens /panel). Pages are never cached (see /sw.js).
window.ffInstall = { evt: null };
window.addEventListener('beforeinstallprompt', function (e) { e.preventDefault(); window.ffInstall.evt = e; if (window.adminInstallRefresh) adminInstallRefresh(); });
window.addEventListener('appinstalled', function () { window.ffInstall.evt = null; if (window.adminInstallRefresh) adminInstallRefresh(); if (window.toast) toast('✅ FluxFilm Admin is on your home screen'); });
if ('serviceWorker' in navigator) window.addEventListener('load', function () { navigator.serviceWorker.register('/sw.js').catch(function () {}); });
</script>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
<style>
/* hidden always wins over display rules (the pause bar rule display:block kept "Shop is PAUSED" visible while open) */
[hidden]{display:none!important}
:root{--brand:#e11d48;--brand2:#f43f5e;--brandbg:#fff1f2;--ink:#0f172a;--ink2:#334155;--mut:#64748b;--line:#e5e9f0;--grid:#e3e7ee;--bg:#f3f5f9;--card:#fff;
--ok:#16a34a;--okbg:#dcfce7;--warn:#b45309;--warnbg:#fef3c7;--bad:#dc2626;--badbg:#fee2e2;--sel:#1a73e8;--side:236px}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;font-family:Poppins,'Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--ink);font-size:14px}
button,input,select{font:inherit}
a{color:inherit}
.muted{color:var(--mut)}
/* ---------- shell ---------- */
.side{position:fixed;inset:0 auto 0 0;width:var(--side);background:#fff;border-right:1px solid var(--line);display:flex;flex-direction:column;z-index:30;transition:transform .2s}
.brand{display:flex;align-items:center;gap:12px;padding:20px 18px 18px;border-bottom:1px solid var(--line)}
.logo{width:42px;height:42px;flex-shrink:0;border-radius:22%;background:#12040a;overflow:hidden;box-shadow:0 6px 16px rgba(18,4,10,.28)}
.logo img{display:block;width:100%;height:100%}
.brand b{display:block;font-size:1.05rem}.brand small{display:block;font-size:.62rem;letter-spacing:1.6px;color:var(--mut);font-weight:600}
.menu{padding:10px 10px;overflow:auto;flex:1}
.menu h6{margin:16px 10px 6px;font-size:.64rem;letter-spacing:1.4px;color:#94a3b8;font-weight:600}
.menu a{display:flex;align-items:center;gap:11px;padding:10px 12px;border-radius:11px;color:var(--ink2);text-decoration:none;cursor:pointer;font-weight:500;margin-bottom:2px;border-left:3px solid transparent}
.menu a:hover{background:#f8fafc}
.menu a.on{background:var(--brandbg);color:var(--brand);font-weight:600;border-left-color:var(--brand)}
.menu a span{width:22px;text-align:center}
.side-install{margin:0 12px 10px;border:1.5px dashed #fda4af;background:#fff1f2;color:#be123c;border-radius:12px;padding:10px;font:inherit;font-weight:700;font-size:.85rem;cursor:pointer}
.sidefoot{padding:14px 18px;border-top:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;font-size:.75rem}
.main{margin-left:var(--side);min-height:100%;display:flex;flex-direction:column}
.top{display:none;align-items:center;gap:10px;padding:10px 14px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:20}
.page{padding:22px 26px;flex:1;min-width:0}
.ph{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin-bottom:16px;flex-wrap:wrap}
.ph h1{margin:0;font-size:1.45rem;font-weight:700}.ph p{margin:2px 0 0;color:var(--mut);font-size:.8rem}
@media(max-width:900px){.side{transform:translateX(-100%)}.side.open{transform:none;box-shadow:0 0 60px rgba(0,0,0,.25)}.main{margin-left:0}.top{display:flex}.page{padding:14px}}
/* ---------- controls ---------- */
.btn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;border:0;border-radius:10px;padding:9px 15px;font-weight:600;cursor:pointer;background:var(--brand);color:#fff;white-space:nowrap}
.btn:hover{filter:brightness(1.05)}
.btn.ghost{background:#fff;color:var(--ink2);border:1px solid var(--line)}
.btn.ghost:hover{background:#f8fafc}
.btn.dark{background:#1e293b}.btn.green{background:#16a34a}.btn.wa{background:#25d366}.btn.red{background:#ef4444}.btn.purple{background:#7c3aed}
.btn.sm{padding:6px 11px;font-size:.78rem;border-radius:8px}
.btn.on{background:#1e293b;color:#fff;border-color:#1e293b}
.inp{padding:9px 13px;border:1px solid var(--line);border-radius:10px;background:#fff;outline:none;min-width:0}
.inp:focus{border-color:var(--brand2);box-shadow:0 0 0 3px rgba(244,63,94,.12)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:18px;box-shadow:0 1px 3px rgba(15,23,42,.04)}
.card h3{margin:0 0 12px;font-size:.98rem;font-weight:600}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.7rem;font-weight:600;line-height:1.6;white-space:nowrap}
.p-ok{background:var(--okbg);color:#166534}.p-warn{background:var(--warnbg);color:#92400e}.p-bad{background:var(--badbg);color:#991b1b}.p-grey{background:#eef2f7;color:#475569}.p-blue{background:#dbeafe;color:#1e40af}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:#0f172a;color:#fff;padding:10px 18px;border-radius:12px;font-size:.85rem;z-index:99;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.on{opacity:1}
/* ---------- dashboard ---------- */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;margin-bottom:16px}
.kpi{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px 18px;display:flex;gap:14px;align-items:center}
.kpi .ic{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;font-size:1.3rem;background:var(--brandbg)}
.kpi .n{font-size:1.4rem;font-weight:700;line-height:1.15}.kpi .l{color:var(--mut);font-size:.74rem}
.g2{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-bottom:16px}@media(max-width:1000px){.g2{grid-template-columns:1fr}}
.chart{position:relative;height:260px}
/* ---------- sheet grid ---------- */
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs a{padding:7px 13px;border-radius:9px;background:#fff;border:1px solid var(--line);cursor:pointer;font-size:.8rem;font-weight:500;color:var(--ink2)}
.tabs a.on{background:#1e293b;color:#fff;border-color:#1e293b}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-bottom:0;border-radius:12px 12px 0 0;padding:8px 10px}
.toolbar .inp{padding:7px 11px;font-size:.82rem}
.fpanel{background:#fff;border:1px solid var(--line);border-bottom:0;padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
#fpanel{display:block;background:#fbfcfe}.fpanel[hidden],#fpanel[hidden]{display:none}
.frow{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}.frow .inp{padding:6px 9px;font-size:.8rem}.frow .grow{flex:1;min-width:120px}
.chip{border:1px solid var(--line);background:#fff;border-radius:999px;padding:4px 11px;font-size:.76rem;cursor:pointer;color:var(--ink2);white-space:nowrap}
.chip.on{background:#1e293b;border-color:#1e293b;color:#fff}.chip b{cursor:pointer;margin-left:4px;opacity:.8}.chip.clear{color:var(--bad);border-color:#fecaca}
.fbar{display:flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--line);border-bottom:0;padding:5px 10px;font-size:.8rem;min-height:34px}
.fbar .fx{color:#94a3b8;font-style:italic;font-weight:600;border-right:1px solid var(--line);padding-right:8px}
.fbar .fname{font-weight:600;color:var(--ink2);min-width:90px}
.fbar .fval{flex:1;font-family:Consolas,monospace;white-space:nowrap;overflow:auto;color:var(--ink)}
.gridwrap{background:#fff;border:1px solid var(--line);overflow:auto;height:calc(100vh - 300px);min-height:320px;position:relative}
table.sheet{border-collapse:separate;border-spacing:0;table-layout:fixed;font-size:12.5px}
.sheet th,.sheet td{border-right:1px solid var(--grid);border-bottom:1px solid var(--grid);padding:0 8px;height:30px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-align:left;vertical-align:middle;background:#fff}
.sheet.comfy th,.sheet.comfy td{height:40px;padding:0 12px;font-size:13px}
.sheet.wrap td{white-space:normal;word-break:break-word;height:auto;padding-top:5px;padding-bottom:5px}
.sheet th{position:sticky;top:0;z-index:3;background:#f5f7fa;color:#475569;font-weight:600;font-size:11.5px;user-select:none;cursor:pointer}
.sheet th:hover{background:#edf1f6}
.sheet th .rz{position:absolute;right:-3px;top:0;bottom:0;width:7px;cursor:col-resize;z-index:4}
.sheet th .rz:hover,.sheet th .rz.drag{background:var(--sel)}
.sheet th .ar{color:var(--sel);margin-left:4px}
.sheet .rn{position:sticky;left:0;z-index:2;background:#f5f7fa;color:#94a3b8;text-align:center;font-size:11px;padding:0 2px}
.sheet th.rn{z-index:5}
.sheet .c1{position:sticky;left:46px;z-index:2;box-shadow:1px 0 0 var(--grid)}
.sheet th.c1{z-index:5}
.sheet tbody tr:hover td{background:#f8fbff}
.sheet tbody tr:hover td.rn{background:#eef2f7}
.sheet td.sel{outline:2px solid var(--sel);outline-offset:-2px;background:#eef5ff !important}
.sheet tr.rsel td.rn{background:#dbe7fb;color:var(--sel);font-weight:700}
.sheet td.num{text-align:right;font-variant-numeric:tabular-nums}
.sheet .edit{border:0;background:transparent;cursor:pointer;color:#94a3b8;font-size:12px;padding:0 2px}
.sheet .edit:hover{color:var(--sel)}
.sheet input[type=checkbox]{width:16px;height:16px;cursor:pointer;accent-color:var(--brand);vertical-align:middle;margin:0}
.sheet .celllink{cursor:pointer;text-decoration:underline dotted #94a3b8}
.foot{display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fff;border:1px solid var(--line);border-top:0;border-radius:0 0 12px 12px;padding:8px 12px;font-size:.8rem}
.dd{position:relative}
.ddm{position:absolute;top:calc(100% + 6px);left:0;background:#fff;border:1px solid var(--line);border-radius:12px;box-shadow:0 12px 40px rgba(15,23,42,.16);padding:8px;z-index:40;max-height:360px;overflow:auto;min-width:230px}
.ddm label{display:flex;gap:8px;align-items:center;padding:5px 8px;border-radius:7px;font-size:.8rem;cursor:pointer}
.ddm label:hover{background:#f5f7fa}
/* ---------- modal ---------- */
.modal{position:fixed;inset:0;background:rgba(15,23,42,.5);display:flex;align-items:flex-start;justify-content:center;z-index:60;overflow:auto;padding:30px 14px}
.mbox{background:#fff;border-radius:18px;width:100%;max-width:720px;box-shadow:0 25px 80px rgba(15,23,42,.35);overflow:hidden}
.mbox.small{max-width:420px}
.mhd{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
.mhd b{font-size:1rem}
.mbody{padding:16px 20px;max-height:66vh;overflow:auto}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:12px}@media(max-width:600px){.fields{grid-template-columns:1fr}}
.fld label{display:block;font-size:.68rem;color:var(--mut);font-weight:600;margin-bottom:4px;text-transform:uppercase;letter-spacing:.3px}
.fld .inp{width:100%}.fld.key .inp{background:#f1f5f9;border-style:dashed}
.mft{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:10px;align-items:center;flex-wrap:wrap}
/* ---------- customer 360 ---------- */
.search{display:flex;gap:10px;margin-bottom:16px}.search .inp{flex:1;padding:12px 16px;font-size:.95rem}
.prof{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.avatar{width:62px;height:62px;border-radius:50%;background:linear-gradient(135deg,var(--brand),#fb7185);color:#fff;display:grid;place-items:center;font-size:1.3rem;font-weight:700;flex-shrink:0}
.prof h2{margin:0;font-size:1.25rem}
.stats{display:flex;gap:26px;margin-top:10px;flex-wrap:wrap}.stats b{display:block;font-size:1.2rem}.stats small{color:var(--mut);font-size:.72rem}
.subhead{display:flex;align-items:center;justify-content:space-between;margin:22px 0 10px;flex-wrap:wrap;gap:8px}
.subhead h3{margin:0;font-size:1rem}
.subs{display:grid;grid-template-columns:repeat(auto-fill,minmax(420px,1fr));gap:14px}@media(max-width:520px){.subs{grid-template-columns:1fr}}
.sc{background:#fff;border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:10px}
.sc.exp{background:#fcfcfd}
.sc .hd{display:flex;gap:12px;align-items:flex-start}
.sc .sic{width:40px;height:40px;border-radius:11px;background:#f5f7fa;display:grid;place-items:center;font-size:1.15rem;flex-shrink:0}
.sc .ttl{flex:1;min-width:0}.sc .ttl b{display:block;font-size:.98rem}.sc .ttl small{color:var(--mut)}
.sc .rt{text-align:right;font-size:.72rem;color:var(--mut)}
.bar{height:5px;background:#eef2f7;border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#22c55e,#16a34a)}
.bar.w i{background:linear-gradient(90deg,#f59e0b,#d97706)}.bar.b i{background:#ef4444}
.creds{background:#f8fafc;border:1px solid var(--line);border-radius:11px;padding:4px 12px}
.cr{display:flex;align-items:center;gap:8px;padding:5px 0;font-size:.8rem;border-bottom:1px dashed #e5e9f0}.cr:last-child{border-bottom:0}
.cr span{color:var(--mut);width:74px;flex-shrink:0}.cr code{flex:1;font-family:Consolas,monospace;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.copy{border:1px solid var(--line);background:#fff;border-radius:7px;font-size:.7rem;padding:2px 8px;cursor:pointer}
.rmbox{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 12px;border-radius:11px;background:#fff7ed;border:1px solid #fed7aa;font-size:.8rem}
.rmbox.off{background:#f8fafc;border-color:var(--line)}
.rmbox input[type=datetime-local]{padding:5px 8px;border:1px solid var(--line);border-radius:8px;font-size:.78rem}
.rmbox input[type=checkbox]{width:17px;height:17px;accent-color:var(--brand)}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:.7rem}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:10px 2px;border-bottom:1px solid #f1f4f8;font-size:.84rem;flex-wrap:wrap}.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:160px}
/* ---------- quick orders ---------- */
.qtabs{display:flex;gap:6px;margin-bottom:14px;flex-wrap:wrap}
.qtabs button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 16px;font-weight:600;cursor:pointer;color:var(--ink2)}
.qtabs button.on{background:#1e293b;color:#fff;border-color:#1e293b}
.qgrid{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(260px,1fr);gap:16px;align-items:start}
@media(max-width:900px){.qgrid{grid-template-columns:1fr}}
.qsec{margin-bottom:14px}
.qsearch{position:relative}.qsearch .inp{width:100%;padding:13px 16px;font-size:1rem}
.qdrop{position:absolute;left:0;right:0;top:calc(100% + 6px);background:#fff;border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(15,23,42,.16);z-index:30;max-height:360px;overflow:auto;padding:6px}
.qopt{display:block;width:100%;text-align:left;border:0;background:transparent;padding:10px 12px;border-radius:10px;cursor:pointer;font-size:.9rem}
.qopt:hover{background:#f5f7fa}.qopt small{display:block;color:var(--mut);font-size:.75rem;margin-top:2px}
.qopt.new{border-top:1px dashed var(--line);border-radius:0 0 10px 10px;color:var(--brand);font-weight:600}
.qcust{display:flex;align-items:center;gap:12px}
.avatar.sm{width:42px;height:42px;font-size:.95rem}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1 1 0;min-width:56px;padding:11px 10px;border:2px solid var(--line);background:#fafafa;border-radius:11px;font-weight:600;cursor:pointer;color:var(--ink2)}
.seg button.on{border-color:var(--brand);background:var(--brandbg);color:var(--brand)}
.rf-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:14px;margin-bottom:16px}
.rf-sec{border:1px solid var(--line);border-radius:14px;padding:14px;background:#fff}
.rf-sec h4{margin:0 0 4px;font-size:.9rem;font-weight:700}.rf-sec p{margin:0 0 10px;color:var(--mut);font-size:.74rem;line-height:1.45}
.rf-f{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}.rf-f.two{grid-template-columns:repeat(2,minmax(0,1fr))}
.rf-f label{display:flex;flex-direction:column;gap:4px;font-size:.7rem;font-weight:600;color:var(--mut)}
.rf-f .inp{padding:8px 10px;font-size:.9rem;font-weight:600;color:var(--ink);width:100%}
.rf-tog{display:flex;align-items:center;gap:10px;font-size:.84rem;font-weight:600;cursor:pointer;margin-bottom:10px}
.rf-tog input{width:20px;height:20px;accent-color:#16a34a}
.rf-ex{width:100%;border-collapse:collapse;font-size:.8rem}.rf-ex th,.rf-ex td{padding:7px 8px;border-bottom:1px solid var(--line);text-align:right}.rf-ex th:first-child,.rf-ex td:first-child{text-align:left}.rf-ex th{color:var(--mut);font-weight:600;font-size:.72rem}
.rf-save{position:sticky;bottom:0;background:linear-gradient(rgba(243,245,249,0),var(--bg) 35%);padding:14px 0 8px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;z-index:31}
.pausebar{display:block;width:100%;border:0;text-align:left;cursor:pointer;background:#fef2f2;color:#991b1b;padding:10px 18px;font:inherit;font-size:.85rem;border-bottom:1px solid #fecaca}
.mt-status{display:flex;align-items:center;gap:14px;flex-wrap:wrap;margin-bottom:16px;border:2px solid #bbf7d0;background:#f0fdf4}
.mt-status.paused{border-color:#fecaca;background:#fef2f2}
/* ── Offers: bar, card, pop-up (themes t-festive/green/red/purple/dark/gold) ── */
.ff-promo { position: relative; overflow: hidden; color: #fff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; }
.ff-promo.t-festive { background: linear-gradient(120deg, #6d28d9, #db2777 55%, #f59e0b); }
.ff-promo.t-green { background: linear-gradient(120deg, #15803d, #16a34a 50%, #34d399); }
.ff-promo.t-red { background: linear-gradient(120deg, #b91c1c, #dc2626 50%, #f97316); }
.ff-promo.t-purple { background: linear-gradient(120deg, #3730a3, #6d28d9 55%, #a855f7); }
.ff-promo.t-dark { background: linear-gradient(120deg, #0f172a, #1e293b 60%, #334155); color: #fde68a; }
.ff-promo.t-gold { background: linear-gradient(120deg, #f59e0b, #fbbf24 55%, #fde68a); color: #3b2300; }
.ff-promo-bar { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 10px; margin: 0 0 12px; padding: 10px 40px 10px 14px; border-radius: 16px; font-size: 13.5px; font-weight: 600; line-height: 1.4; box-shadow: 0 6px 18px rgba(15,23,42,.14); }
.ff-promo-emoji { font-size: 20px; }
.ff-promo-text { flex: 1 1 180px; }
.ff-promo-text b { font-weight: 900; }
.ff-promo-timer { display: inline-flex; align-items: center; gap: 4px; padding: 3px 9px; border-radius: 999px; background: rgba(255,255,255,.2); font-size: 12.5px; font-weight: 800; font-variant-numeric: tabular-nums; white-space: nowrap; }
.ff-promo-code { display: inline-flex; align-items: center; gap: 4px; padding: 4px 10px; border: 1.5px dashed currentColor; border-radius: 10px; background: rgba(255,255,255,.14); color: inherit; font: inherit; font-size: 13px; cursor: pointer; white-space: nowrap; }
.ff-promo-code span { font-size: 10px; font-weight: 800; letter-spacing: .08em; opacity: .85; }
.ff-promo-code b { font-weight: 900; letter-spacing: .06em; }
.ff-promo-cta { border: 0; border-radius: 999px; padding: 7px 14px; background: #fff; color: #0f172a; font: inherit; font-size: 13px; font-weight: 900; cursor: pointer; white-space: nowrap; box-shadow: 0 4px 12px rgba(0,0,0,.15); }

/* ================= phone Back button + ← arrows (History API) ================= */
// Every screen is a browser history entry, so the phone's Back button (and the ← arrow) goes to the previous screen
// instead of closing the installed app. A modal or the side menu adds a light entry, so Back closes it first.
// Editors (Plans, Offers) add an entry too. Unsaved changes ask before they are thrown away.
// In the installed app a "Today" entry sits at the bottom: Back there says "Press back again to exit".
var H = { cur: null, skip: 0, queue: [], subClose: null, inited: false, exitTimer: null };
function hCopy(a, b) { var o = {}, k; for (k in a || {}) if (k !== 'n' && k !== 'root') o[k] = a[k]; for (k in b || {}) o[k] = b[k]; return o; }
function hUrl(st) { var u = new URL(location.href); u.searchParams.delete('v'); u.hash = st.ffv || ''; return u.pathname + u.search + u.hash; }
function hPush(st) {
  if (H.skip) { H.queue.push(function () { hPush(st); }); return; }
  st.n = (H.cur ? H.cur.n || 0 : 0) + 1; H.cur = st;
  try { history.pushState(st, '', hUrl(st)); } catch (e) {}
}
function hReplace(st) {
  if (H.skip) { H.queue.push(function () { hReplace(st); }); return; }
  st.n = H.cur ? H.cur.n || 0 : 0; if (H.cur && H.cur.root && !st.layer && st.ffv === 'today') st.root = 1; H.cur = st;
  try { history.replaceState(st, '', hUrl(st)); } catch (e) {}
}
// Remove the top entry (a modal / menu / editor closed by its own button) without that Back doing anything else.
function hDropTop() {
  if (!H.cur || !H.cur.n) return;
  H.skip++; H.cur = hCopy(H.cur, { layer: null, sub: null }); H.cur.n = Math.max(0, (H.cur.n || 1) - 1);
  clearTimeout(H.skipT); H.skipT = setTimeout(function () { hFlush(null); }, 900);
  try { history.back(); } catch (e) { hFlush(null); }
}
function hFlush(st) {
  H.skip = 0; clearTimeout(H.skipT);
  if (st && st.ffv) H.cur = st;
  var q = H.queue; H.queue = []; q.forEach(function (f) { f(); });
}
function hInit() {
  if (H.inited) return; H.inited = true;
  if (adminStandalone()) {
    H.cur = { ffv: 'today', n: 0, root: 1 };
    try { history.replaceState(H.cur, '', hUrl(H.cur)); } catch (e) {}
    hPush({ ffv: S.view });
  } else hReplace({ ffv: S.view });
}
function modalDirty() { var m = $('#modal'); return !!(m && m.getAttribute('data-dirty') === '1'); }
function viewDirty() { return $$('#view .rf-state.dirty').some(function (el) { return /not saved/i.test(el.textContent); }); }
function hLeaveBlocked(onlyModal) {
  var dirty = onlyModal ? modalDirty() : (modalDirty() || viewDirty());
  return dirty && !confirm('Leave without saving?\n\nYour changes on this screen will be lost.');
}
// ← arrow in the header and the ← Back buttons inside editors.
function hBack() {
  if (H.cur && H.cur.n > 0) { history.back(); return; }
  if (H.subClose) { if (hLeaveBlocked()) return; var f = H.subClose; H.subClose = null; f(); hHeader(); return; }
  if (S.view !== 'today') nav('today');
}
function hHeader() { var b = $('#gback'); if (b) b.hidden = S.view === 'today' && !(H.cur && H.cur.sub); }
// An editor (sub-screen) opened inside the current view.
function hSub(name, close) {
  H.subClose = close;
  if (!(H.cur && H.cur.sub === name && H.cur.ffv === S.view && !H.cur.layer)) hPush(hCopy(H.cur, { ffv: S.view, sub: name, layer: null }));
  hHeader();
}
// The editor closed by itself (deleted, list re-shown): forget its entry.
function hSubDone(name) {
  if (H.cur && H.cur.sub === name && !H.cur.layer) { H.subClose = null; hDropTop(); }
  hHeader();
}
function toggleSide(open) {
  var sd = $('#side'); if (!sd) return;
  var on = open == null ? !sd.classList.contains('open') : !!open;
  if (on === sd.classList.contains('open')) return;
  sd.classList.toggle('open', on);
  if (on) hPush(hCopy(H.cur, { layer: 'side' })); else if (H.cur && H.cur.layer === 'side') hDropTop();
}
window.addEventListener('popstate', function (e) {
  var st = e.state;
  if (H.skip) { hFlush(st); return; }
  if (!H.inited || !$('#view')) return; // signed out: nothing to show
  if (!st || !st.ffv) { // typed /panel#orders into the address bar
    var dv = hDeepLink(); if (dv) { H.cur = H.cur || { ffv: S.view, n: 0 }; if (!hLeaveBlocked()) { S.view = dv; store('ff_view', dv); hReplace({ ffv: dv }); route(); } }
    return;
  }
  var cur = H.cur || { ffv: S.view, n: 0 };
  var back = (st.n || 0) < (cur.n || 0);
  var closingModal = cur.layer === 'modal' && st.layer !== 'modal';
  var leavingScreen = st.ffv !== cur.ffv || (cur.sub && st.sub !== cur.sub);
  if ((closingModal && hLeaveBlocked(true)) || (!closingModal && leavingScreen && hLeaveBlocked())) {
    try { history.pushState(cur, '', hUrl(cur)); } catch (x) {} // stay: put the entry back
    H.cur = cur; return;
  }
  H.cur = st;
  clearTimeout(H.exitTimer);
  if (closingModal) { var m = $('#modal'); if (m) m.remove(); }
  var sd = $('#side'); if (cur.layer === 'side' && st.layer !== 'side' && sd) sd.classList.remove('open');
  // An entry whose modal / menu / editor is already gone: skip over it (Back) or tidy it (Forward).
  var deadLayer = (st.layer === 'modal' && !$('#modal')) || (st.layer === 'side' && !(sd && sd.classList.contains('open')));
  if (st.ffv !== S.view) {
    S.view = st.ffv; store('ff_view', st.ffv); H.subClose = null;
    if (st.ffv === 'customer' && st.phone) store('ff_last_phone', st.phone);
    route();
  } else if (cur.sub && st.sub !== cur.sub) {
    var f = H.subClose; H.subClose = null; if (f) f();
  } else if (st.ffv === 'customer' && st.phone && st.phone !== cur.phone && $('#cp')) {
    $('#cp').value = st.phone; lookup(true);
  }
  var deadSub = st.sub && !H.subClose;
  if (deadLayer || deadSub) {
    if (back && st.n > 0) { H.cur = hCopy(st, { layer: null, sub: null }); H.cur.n = st.n; history.back(); return; }
    hReplace(hCopy(st, { layer: null, sub: null }));
  }
  hHeader();
  if (st.root && back) {
    if (cur.ffv === 'today' && !cur.sub && !cur.layer) {
      // Installed app, on Today, nothing left: next Back (within 2.5 s) closes the app.
      toast('Press back again to exit');
      H.exitTimer = setTimeout(function () { if (H.cur && H.cur.root) hPush({ ffv: 'today' }); }, 2500);
    } else hPush({ ffv: 'today' });
  }
});
// /panel#orders or /panel?v=orders opens that screen (after sign-in too).
function hDeepLink() {
  var v = '';
  try { v = new URLSearchParams(location.search).get('v') || decodeURIComponent((location.hash || '').slice(1)); } catch (e) {}
  return v && Object.prototype.hasOwnProperty.call(viewMap(), v) ? v : '';
}

/* ================= new version ready (appversion.js) ================= */
// An installed app left open keeps the old page. When it comes back to the front (and every 10 minutes) we ask the
// server for its version id; if it changed, a bar offers Refresh. Admin never reloads by itself (forms may be open).
var UPD = { last: 0, shown: false };
function updCheck() {
  if (!window.FF_VERSION || UPD.shown || document.visibilityState === 'hidden') return;
  UPD.last = Date.now();
  fetch('/version', { cache: 'no-store', credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (r) {
    if (!r || !r.version || r.version === window.FF_VERSION) return;
    try { if (navigator.serviceWorker) navigator.serviceWorker.getRegistration('/').then(function (reg) { if (reg) reg.update(); }).catch(function () {}); } catch (e) {}
    updShow();
  }).catch(function () {});
}
function updShow() {
  UPD.shown = true;
  var b = $('#updbar');
  if (!b) {
    b = document.createElement('div'); b.id = 'updbar'; b.className = 'updbar'; b.setAttribute('role', 'status');
    b.innerHTML = '<span>🔄 New version ready</span><button class="btn green sm" onclick="updReload()">Refresh</button><button class="x" aria-label="Later" onclick="updHide()">✕</button>';
    document.body.appendChild(b);
  }
  b.hidden = false;
}
function updHide() { var b = $('#updbar'); if (b) b.hidden = true; UPD.shown = false; UPD.last = Date.now(); }
function updReload() { if (hLeaveBlocked()) return; location.reload(); }
document.addEventListener('visibilitychange', function () { if (document.visibilityState === 'visible' && Date.now() - UPD.last > 15000) updCheck(); });
setInterval(updCheck, 10 * 60000);

  var shown = subs.filter(function (s) { var d = daysLeft(s.expiry_date); var act = /ACTIVE/i.test(s.status) && (d == null || d > 0); return filter === 'all' || (filter === 'active' ? act : !act); });

    Q.subsLoading = false;

function qrPreview() { return PM.qr ? '<img src="' + esc(PM.qr) + '" alt="Backup QR"/>' : '<div class="muted" style="font-size:.8rem;padding:24px 10px">No QR uploaded yet</div>'; }
// Phones take big photos: shrink to ≤ 720 px before sending (keeps the QR sharp, the upload small).
function uploadQr(file) {
  var st = $('#pmqrst'); st.className = 'rf-state'; st.textContent = '⏳ Preparing…';
  var rd = new FileReader();
  rd.onload = function () {
    var src = String(rd.result || '');
    if (file.size <= 300000) return sendQr(src);
    var img = new Image();
    img.onload = function () {
      var k = Math.min(1, 720 / Math.max(img.width, img.height)), cv = document.createElement('canvas');
      cv.width = Math.round(img.width * k); cv.height = Math.round(img.height * k);
      var cx = cv.getContext('2d'); cx.fillStyle = '#fff'; cx.fillRect(0, 0, cv.width, cv.height); cx.drawImage(img, 0, 0, cv.width, cv.height);
      sendQr(cv.toDataURL('image/jpeg', 0.9));
    };
    img.onerror = function () { st.className = 'rf-state bad'; st.textContent = '⚠️ Could not read that picture'; };
    img.src = src;
  };
  rd.readAsDataURL(file);
}
function sendQr(dataUrl) {
  var st = $('#pmqrst'); st.className = 'rf-state'; st.textContent = '⏳ Uploading…';
  post('/admin/api/payments/qr', { dataUrl: dataUrl }).then(function (r) {
    if (!r.ok) { st.className = 'rf-state bad'; st.textContent = '⚠️ ' + (r.message || 'failed'); return; }
    PM.qr = dataUrl; $('#pmqr').innerHTML = qrPreview(); $('#pmqrdel').hidden = !dataUrl;
    st.className = 'rf-state ok'; st.textContent = dataUrl ? '✅ QR saved — live now' : '✅ QR removed'; toast(dataUrl ? '✅ Backup QR saved' : 'QR removed');
  });
}

function cnEarn(event, amount) {
  var s = CN.s; if (!s.earnEnabled) return 0; amount = Number(amount) || 0;
  if (amount < Number(s.earnMinOrder || 0) || Number(s.earnPer100) <= 0) return 0;
  var base = Math.floor(amount / 100 * Number(s.earnPer100));
  return Math.max(0, Math.floor(base * Number(/RENEW/.test(event) ? s.earnRenewMultiplier : s.earnNewMultiplier)));
}
function cnSpend(amount) {
  var s = CN.s; if (!s.spendEnabled) return { coins: 0, rupees: 0 };
  var value = Number(s.coinValue) || 1, maxRupees = Math.floor(Math.max(0, amount) * Number(s.maxPercent) / 100);
  var coins = Math.floor(maxRupees / value + 1e-9); if (coins <= 0) return { coins: 0, rupees: 0 };
  var rupees = Math.floor(coins * value + 1e-9); return { coins: Math.ceil(rupees / value - 1e-9), rupees: rupees };
}

var RF = { s: null, dirty: false };
var RF_KIND = { FIRST: ['🥇 1st order', 'p-ok'], REPEAT: ['🔁 Next order', 'p-blue'], LEVEL2: ['🔗 Friend of friend', 'p-warn'] };
var RF_STATUS = { PAID: 'p-ok', PENDING: 'p-warn', FAILED: 'p-bad', SKIPPED: 'p-grey' };
function rfCoins(amount, pct, min, max) {
  amount = Number(amount) || 0; pct = Number(pct) || 0;
  if (amount <= 0 || pct <= 0) return 0;
  var c = Math.round(amount * pct / 100); c = Math.max(c, Math.round(Number(min) || 0));
  if (Number(max) > 0) c = Math.min(c, Math.round(Number(max)));
  return Math.max(0, c);
}
function referralsView() {
  $('#view').innerHTML = '<div class="ph"><div><h1>🎁 Referrals</h1><p>What invited friends get and what referrers earn. Changes apply to the website straight away — no Hostinger needed.</p></div>' +
    '<button class="btn ghost sm" id="rffix">🔁 Fix missed rewards</button></div><div id="rfbody"><p class="muted">Loading…</p></div>';
  $('#rffix').onclick = function () {
    var b = $('#rffix'); b.disabled = true; b.textContent = 'Checking…';
    post('/admin/api/referrals/reconcile', { days: 90 }).then(function (r) {
      b.disabled = false; b.textContent = '🔁 Fix missed rewards';
      if (!r.ok) { toast('⚠️ ' + (r.message || 'failed')); return; }
      toast(r.paid || r.failed ? '✅ ' + r.paid + ' reward(s) paid' + (r.failed ? ', ⚠️ ' + r.failed + ' still failing' : '') : '✅ Nothing missed — all rewards are paid');
      loadReferrals();
    });
  };
  loadReferrals();
}
function loadReferrals() {
  Promise.all([api('/admin/api/referrals/settings'), api('/admin/api/referrals/overview')]).then(function (res) {
    if (!$('#rfbody')) return;
    var st = res[0], ov = res[1];
    if (!st.ok) { $('#rfbody').innerHTML = '<div class="card muted">' + esc(st.message || 'error') + '</div>'; return; }
    RF.s = st.settings; RF.dirty = false;
    renderReferrals(st, ov.ok ? ov : null);
  });
}
function rfInput(key, label, suffix, step) {
  return '<label>' + label + '<input class="inp" type="number" inputmode="decimal" min="0" step="' + (step || 1) + '" data-rf="' + key + '" value="' + esc(RF.s[key]) + '"/>' + (suffix ? '<span style="font-weight:500">' + suffix + '</span>' : '') + '</label>';
}
function rfExamples() {
  var s = RF.s;
  return '<table class="rf-ex"><tr><th>Friend pays</th><th>You get on 1st order</th><th>Next ' + (s.repeatOrders || 0) + ' orders (each)</th><th>Friend-of-friend</th></tr>' +
    [39, 99, 169, 499, 1849].map(function (a) {
      return '<tr><td><b>₹' + a + '</b></td><td>' + rfCoins(a, s.firstPercent, s.firstMin, s.firstMax) + ' coins</td><td>' + (s.repeatOrders > 0 ? rfCoins(a, s.repeatPercent, s.repeatMin, s.repeatMax) + ' coins' : '—') + '</td><td>' + (s.level2Enabled ? rfCoins(a, s.level2Percent, s.level2Min, s.level2Max) + ' coins' : 'off') + '</td></tr>';
    }).join('') + '</table>';
}
function renderReferrals(st, ov) {
  var s = RF.s;
  var h = st.needsSchema ? '<div class="qnote warn" style="margin:0 0 14px">Run <b>db/schema-v15.sql</b> in phpMyAdmin to switch referrals on. Until then the website checkout works normally without invite discounts.</div>' : '';
  if (ov && !ov.needsSchema) {
    h += '<div class="kpis"><div class="kpi"><div class="ic">📨</div><div><div class="n">' + ov.invited + '</div><div class="l">Friends invited · ' + ov.waiting + ' waiting to pay</div></div></div>' +
      '<div class="kpi"><div class="ic">🤝</div><div><div class="n">' + ov.joined + '</div><div class="l">Became customers (1st order paid)</div></div></div>' +
      '<div class="kpi"><div class="ic">🪙</div><div><div class="n">' + ov.coinsPaid + '</div><div class="l">Coins given · ' + ov.month.coins + ' this month</div></div></div>' +
      '<div class="kpi"><div class="ic">' + (ov.problems.length ? '⚠️' : '✅') + '</div><div><div class="n">' + ov.problems.length + '</div><div class="l">' + (ov.problems.length ? 'Rewards not paid yet — tap Fix missed rewards' : 'Rewards not paid') + '</div></div></div></div>';
  }
  h += '<div class="card" style="margin-bottom:16px"><h3>⚙️ Settings</h3>' +
    '<label class="rf-tog"><input type="checkbox" data-rf="enabled"' + (s.enabled ? ' checked' : '') + '/> Refer & earn is ON <span class="muted" style="font-weight:500">(untick to pause invites and rewards)</span></label>' +
    '<div class="rf-grid">' +
    '<div class="rf-sec"><h4>🧑‍🤝‍🧑 Invited friend</h4><p>Money off their first order. New customers only; a coupon replaces it.</p><div class="rf-f two">' + rfInput('friendDiscount', 'Discount', '₹ off') + rfInput('minOrder', 'Min. order', '₹ (0 = any)') + '</div></div>' +
    '<div class="rf-sec"><h4>🥇 Referrer · friend\'s 1st order</h4><p>Coins = % of what the friend paid, kept between min and max (max 0 = no cap).</p><div class="rf-f">' + rfInput('firstPercent', 'Percent', '%', 0.5) + rfInput('firstMin', 'Min', 'coins') + rfInput('firstMax', 'Max', 'coins') + '</div>' +
      '<div class="rf-f two" style="margin-top:8px">' + rfInput('maxPerMonth', 'Limit per referrer', 'friends / month (0 = none)') + '</div></div>' +
    '<div class="rf-sec"><h4>🔁 Referrer · friend\'s next orders</h4><p>Smaller reward on the friend\'s next paid orders (renewals count).</p><div class="rf-f two">' + rfInput('repeatOrders', 'How many orders', 'after the 1st (0 = off)') + rfInput('repeatPercent', 'Percent', '%', 0.5) + '</div>' +
      '<div class="rf-f two" style="margin-top:8px">' + rfInput('repeatMin', 'Min', 'coins') + rfInput('repeatMax', 'Max', 'coins') + '</div></div>' +
    '<div class="rf-sec"><h4>🔗 2 levels · friend\'s friend</h4><p>When your friend invites someone, you also get coins once — on that person\'s 1st paid order.</p>' +
      '<label class="rf-tog"><input type="checkbox" data-rf="level2Enabled"' + (s.level2Enabled ? ' checked' : '') + '/> 2-level rewards ON</label><div class="rf-f">' + rfInput('level2Percent', 'Percent', '%', 0.5) + rfInput('level2Min', 'Min', 'coins') + rfInput('level2Max', 'Max', 'coins') + '</div></div>' +
    '</div><h3 style="margin-top:4px">👀 What people get</h3><div id="rfex" style="overflow-x:auto">' + rfExamples() + '</div>' +
    '<div class="rf-save"><button class="btn green" id="rfsave">💾 Save settings</button><span class="rf-state" id="rfstate"></span></div></div>';
  if (ov && !ov.needsSchema) {
    if (ov.problems.length) {
      h += '<div class="card" style="margin-bottom:16px;border-color:#fecaca"><h3>⚠️ Not paid yet</h3><div class="list">' + ov.problems.map(function (p) {
        return '<div class="li"><div class="grow"><b>' + esc(p.name || p.beneficiary_phone) + '</b> <span class="muted">· ' + esc(p.beneficiary_phone) + '</span><div class="muted" style="font-size:.72rem">' + (RF_KIND[p.kind] || [p.kind])[0] + ' · order ' + esc(p.order_id) + ' · ' + prettyDate(p.created_at, true) + (p.reason ? ' · ' + esc(p.reason) : '') + '</div></div><b>' + p.coins + ' coins</b> <span class="pill ' + (RF_STATUS[p.status] || 'p-grey') + '">' + esc(p.status) + '</span></div>';
      }).join('') + '</div></div>';
    }
    h += '<div class="g2"><div class="card"><h3>🕘 Recent rewards</h3><div class="list">' + (ov.recent.length ? ov.recent.map(function (r) {
      return '<div class="li"><div class="grow" style="min-width:0"><b>' + esc(r.beneficiary_name || r.beneficiary_phone) + '</b> <span class="pill ' + (RF_KIND[r.kind] || ['', 'p-grey'])[1] + '">' + (RF_KIND[r.kind] || [r.kind])[0] + '</span>' +
        '<div class="muted" style="font-size:.72rem">friend ' + esc(r.friend_name || r.friend_phone) + ' paid ' + money(r.order_amount) + ' (' + esc(r.order_id) + ') · ' + Number(r.percent) + '% · ' + prettyDate(r.created_at, true) + (r.reason ? ' · ' + esc(r.reason) : '') + '</div></div>' +
        '<div style="text-align:right"><b>' + r.coins + '</b> <span class="muted" style="font-size:.72rem">coins</span><div><span class="pill ' + (RF_STATUS[r.status] || 'p-grey') + '">' + esc(r.status) + '</span></div></div></div>';
    }).join('') : '<p class="muted">No rewards yet.</p>') + '</div></div>' +
      '<div class="card"><h3>🏆 Top referrers</h3><div class="list">' + (ov.top.length ? ov.top.map(function (x, i) {
        return '<div class="li"><span>' + (['🥇', '🥈', '🥉'][i] || (i + 1) + '.') + '</span><div class="grow"><b>' + esc(x.name || x.phone) + '</b><div class="muted" style="font-size:.72rem">' + esc(x.phone) + ' · ' + x.friends + ' friend' + (x.friends == 1 ? '' : 's') + '</div></div><b>' + x.coins + '</b></div>';
      }).join('') : '<p class="muted">Nobody yet.</p>') + '</div></div></div>';
  }
  $('#rfbody').innerHTML = h;
  var body = $('#rfbody');
  var onChange = function (e) {
    var el = e.target.closest('[data-rf]'); if (!el) return;
    var k = el.getAttribute('data-rf');
    RF.s[k] = el.type === 'checkbox' ? el.checked : (el.value === '' ? '' : Number(el.value));
    RF.dirty = true; rfState('dirty', '● Not saved yet'); $('#rfex').innerHTML = rfExamples();
  };
  body.addEventListener('input', onChange); body.addEventListener('change', onChange);
  $('#rfsave').onclick = function () {
    saveSettingsBtn($('#rfsave'), '/admin/api/referrals/settings', RF.s, rfState, function (r) { RF.s = r.settings; RF.dirty = false; $('#rfex').innerHTML = rfExamples(); });
  };
}

/* ================= extend a subscription ================= */
function extendDialog(subId) {
  var sub = ((S.cust && S.cust.subs) || []).find(function (x) { return x.sub_id === subId; }) || { sub_id: subId };
  var preview = function (days) {
    var e = istDate(sub.expiry_date); if (!e || !days) return '';
    var n = new Date(e.getTime() + days * 86400000), p = new Date(n.getTime() + 5.5 * 3600e3);
    return 'New expiry: <b>' + p.getUTCDate() + ' ' + MON[p.getUTCMonth()] + ' ' + p.getUTCFullYear() + '</b>';
  };
  modal('⏱ Extend ' + esc(sub.service || subId),
    '<p class="muted" style="margin-top:0;font-size:.82rem">' + esc(sub.plan || '') + ' · ' + esc(subId) + ' · ends ' + prettyDate(sub.expiry_date, true) + '</p>' +
    '<div class="fld"><label>Days (use a minus to take days off)</label><div class="row"><input class="inp" id="exd" type="number" value="2" style="width:100px"/>' + [1, 2, 3, 7, 30].map(function (n) { return '<button class="chip" data-d="' + n + '">+' + n + '</button>'; }).join('') + '</div></div>' +
    '<div class="qnote" id="exprev">' + preview(2) + '</div>' +
    '<div class="fld" style="margin-top:12px"><label>Reason (saved in the change log)</label><input class="inp" id="exr" placeholder="e.g. Netflix not working 12–14 Sep"/><div class="row" style="margin-top:6px">' + ['Service not working', 'Goodwill', 'Late delivery', 'Wrong login given'].map(function (x) { return '<button class="chip" data-r="' + esc(x) + '">' + esc(x) + '</button>'; }).join('') + '</div></div>',
    '<button class="btn green" id="exgo">⏱ Save</button><span id="exmsg" class="muted"></span>', 'small');
  var box = $('#modal');
  box.addEventListener('click', function (e) {
    var dd = e.target.closest('[data-d]'), rr = e.target.closest('[data-r]');
    if (dd) { $('#exd').value = dd.getAttribute('data-d'); $('#exprev').innerHTML = preview(+$('#exd').value); }
    if (rr) $('#exr').value = rr.getAttribute('data-r');
  });
  $('#exd').addEventListener('input', function () { $('#exprev').innerHTML = preview(parseInt($('#exd').value, 10) || 0); });
  $('#exgo').onclick = function () {
    var days = parseInt($('#exd').value, 10), reason = $('#exr').value.trim();
    if (!days) { $('#exmsg').textContent = 'Enter the number of days.'; return; }
    if (!reason) { $('#exmsg').textContent = 'Add a short reason.'; $('#exr').focus(); return; }
    $('#exgo').disabled = true; $('#exmsg').textContent = 'Saving…';
    post('/admin/api/subs/extend', { subId: subId, days: days, reason: reason }).then(function (r) {
      if (!r.ok) { $('#exgo').disabled = false; $('#exmsg').textContent = '⚠️ ' + (r.message || 'failed'); return; }
      closeModal(); toast('⏱ ' + (days > 0 ? '+' : '') + days + ' day(s) · now ends ' + prettyDate(r.after.expiry));
      if (typeof lookup === 'function' && $('#cp')) lookup();
    });
  };
}

/* ================= boot ================= */
document.addEventListener('click', function (e) { var b = e.target.closest('[data-copy]'); if (b) copy(b.getAttribute('data-copy')); });
// Old versions kept the admin key in this browser's storage: wipe it.
try { localStorage.removeItem('ff_admin_key'); localStorage.removeItem('ff_admin_key2'); } catch (e) {}
fetch('/admin/api/me', { credentials: 'same-origin' }).then(function (r) { return r.json(); }).then(function (r) { S.weak = r.weakPassword; if (r.ok) { shell(); route(); } else loginView(); }).catch(function () { loginView('Could not reach the server.'); });
</script></body></html>
