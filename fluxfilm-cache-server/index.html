/* ── Maintenance screen: 3D-style construction scene (transform/opacity only) ── */
.ff-mt { max-width: 520px; margin: 8px auto 0; padding-bottom: 90px; text-align: center; }

.ff-mt-cloud1 { animation: ffMtDrift 11s ease-in-out infinite alternate; }
.ff-mt-cloud2 { animation: ffMtDrift 14s ease-in-out infinite alternate-reverse; }
.ff-mt-cable { transform-origin: 50% 0; animation: ffMtCable 6s ease-in-out infinite; }
.ff-mt-load { transform-origin: 60% 0; animation: ffMtLoad 6s ease-in-out infinite; }
.ff-mt-hammer { transform-origin: 20% 0; animation: ffMtHammer .7s ease-in-out infinite; }
.ff-mt-sparks { transform-origin: 50% 50%; animation: ffMtSpark .7s ease-out infinite; }
.ff-mt-barrow { transform-origin: 50% 50%; animation: ffMtPush 7s ease-in-out infinite; }
.ff-mt-walk .ff-mt-leg1 { transform-origin: 50% 0; animation: ffMtStep .5s ease-in-out infinite alternate; }
.ff-mt-walk .ff-mt-leg2 { transform-origin: 50% 0; animation: ffMtStep .5s ease-in-out infinite alternate-reverse; }
.ff-mt-wave { transform-origin: 20% 0; animation: ffMtWave 2.4s ease-in-out infinite; }
@keyframes ffMtTilt { 0%,100% { transform: perspective(900px) rotateX(7deg) rotateY(-7deg); } 50% { transform: perspective(900px) rotateX(4deg) rotateY(7deg); } }
@keyframes ffMtSpin { to { transform: rotate(360deg); } }
@keyframes ffMtDrift { from { transform: translateX(-14px); } to { transform: translateX(16px); } }
@keyframes ffMtCable { 0% { transform: scaleY(.12); } 42% { transform: scaleY(1); } 80% { transform: scaleY(1); } 92%,100% { transform: scaleY(.12); } }
@keyframes ffMtLoad { 0% { transform: translateY(-24px) rotate(-3deg); opacity: 1; } 20% { transform: translateY(-18px) rotate(3deg); } 42% { transform: translateY(0) rotate(0); } 46% { transform: translateY(-2px); } 50%,80% { transform: translateY(0); opacity: 1; } 90% { transform: translateY(0); opacity: 0; } 91% { transform: translateY(-24px) rotate(-3deg); opacity: 0; } 100% { transform: translateY(-24px) rotate(-3deg); opacity: 1; } }
@keyframes ffMtHammer { 0%,100% { transform: rotate(-35deg); } 50% { transform: rotate(25deg); } }
@keyframes ffMtSpark { 0%,45% { transform: scale(.2); opacity: 0; } 55% { transform: scale(1.2); opacity: 1; } 100% { transform: scale(.6); opacity: 0; } }
@keyframes ffMtPush { 0% { transform: translateX(0) scaleX(1); } 45% { transform: translateX(52px) scaleX(1); } 50% { transform: translateX(52px) scaleX(-1); } 95% { transform: translateX(0) scaleX(-1); } 100% { transform: translateX(0) scaleX(1); } }
@keyframes ffMtStep { from { transform: rotate(-16deg); } to { transform: rotate(16deg); } }
@keyframes ffMtWave { 0%,60%,100% { transform: rotate(0); } 70% { transform: rotate(-40deg); } 80% { transform: rotate(-10deg); } 90% { transform: rotate(-40deg); } }
.ff-mt-title { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 23px; font-weight: 900; color: #0f172a; margin: 6px 0 8px; }
.ff-mt-msg { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 15px; font-weight: 600; color: #475569; line-height: 1.55; margin: 0 auto 12px; max-width: 420px; }
.ff-mt-back { display: inline-block; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 14px; font-weight: 700; color: #92400e; background: #fef3c7; border: 1px solid #fde68a; border-radius: 999px; padding: 8px 16px; margin-bottom: 12px; }
.ff-mt-safe { font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13px; font-weight: 600; color: #166534; background: #f0fdf4; border: 1px solid #bbf7d0; border-radius: 14px; padding: 10px 14px; margin: 0 auto 16px; max-width: 420px; line-height: 1.5; }
.ff-mt-btns { display: grid; gap: 10px; max-width: 420px; margin: 0 auto; }
.ff-pausebar { display: flex; gap: 10px; align-items: center; margin: 0 0 14px; padding: 12px 14px; border-radius: 16px; background: linear-gradient(135deg,#fffbeb,#fef3c7); border: 1.5px solid #fcd34d; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13.5px; font-weight: 600; color: #78350f; line-height: 1.45; text-align: left; }
.ff-pausebar-ic { font-size: 22px; }
@media (prefers-reduced-motion: reduce) { .ff-mt-scene, .ff-mt-scene * { animation: none !important; } }
/* ── Rocket art (RocketArt): float + 3D tilt, flame flicker ── */
.ff-rocket3d { display: block; overflow: visible; }
.ff-rocket3d .ff-rk-ship { transform-box: fill-box; transform-origin: 50% 60%; animation: ffRkFloat 1.8s ease-in-out infinite; }
.ff-rocket3d .ff-rk-flame { transform-box: fill-box; transform-origin: 50% 0; animation: ffRkFlame .22s ease-in-out infinite alternate; }

@keyframes ffRkFlame { from { transform: scaleY(.8) scaleX(.9); opacity: .85; } to { transform: scaleY(1.15) scaleX(1.05); opacity: 1; } }

@media (prefers-reduced-motion: reduce) { .ff-rocket3d .ff-rk-ship, .ff-rocket3d .ff-rk-flame, .ff-rocket3d .ff-rk-shadow { animation: none; } }
/* ── My plans filter chips: All · Active · Expired ── */
.ff-subfilter { display: flex; gap: 6px; margin: 0 0 12px; }
.ff-subfilter button { flex: 1 1 0; min-width: 0; min-height: 42px; padding: 8px 4px; display: inline-flex; align-items: center; justify-content: center; gap: 5px; white-space: nowrap; overflow: hidden; border-radius: 999px; border: 1.5px solid #e2e8f0; background: #fff; font-family: 'Plus Jakarta Sans', system-ui, sans-serif; font-size: 13.5px; font-weight: 800; color: #475569; cursor: pointer; transition: background .15s, border-color .15s, color .15s; }
.ff-subfilter button i { width: 8px; height: 8px; border-radius: 50%; flex: none; background: #22c55e; box-shadow: 0 0 0 2px rgba(34,197,94,.18); }

/* ── Splash: "ribbon reveal" intro, once per session (see #ff-splash script) ──
   Mint ribbons unfurl into the play button, the logo locks in, then the camera dives through it past light streaks. */
#ff-splash { position: fixed; inset: 0; z-index: 9999; display: grid; place-items: center; overflow: hidden; background: radial-gradient(120% 70% at 50% 42%, #0b2a1f 0%, #04140e 60%, #020a07 100%); animation: ffSplashOut .3s ease-in 1.9s forwards; -webkit-tap-highlight-color: transparent; }
#ff-splash[hidden] { display: none; }
.ff-sp-stage { position: relative; width: 104px; height: 104px; margin-top: -6vh; }
.ff-sp-rib, .ff-sp-logo { position: absolute; inset: 0; }
.ff-sp-rib { display: flex; clip-path: polygon(28% 19%, 28% 81%, 87% 50%); animation: ffSpFade .25s ease .95s forwards; }
.ff-sp-rib span { flex: 1; transform: scaleY(0); transform-origin: 50% 0; box-shadow: inset -3px 0 5px rgba(4,20,14,.35); animation: ffSpRib .5s cubic-bezier(.2,.85,.25,1) forwards; }
.ff-sp-rib span:nth-child(even) { transform-origin: 50% 100%; }
.ff-sp-rib span:nth-child(1) { background: #1fae78; } .ff-sp-rib span:nth-child(2) { background: #2cc38a; animation-delay: .06s; }
.ff-sp-rib span:nth-child(3) { background: #43d69b; animation-delay: .12s; } .ff-sp-rib span:nth-child(4) { background: #6ee7b7; animation-delay: .18s; }
.ff-sp-rib span:nth-child(5) { background: #8ef0c8; animation-delay: .24s; } .ff-sp-rib span:nth-child(6) { background: #a7f3d0; animation-delay: .3s; }
.ff-sp-rib span:nth-child(7) { background: #c9f8e3; animation-delay: .36s; }
.ff-sp-logo { opacity: 0; animation: ffSpLogoIn .35s ease-out .82s forwards, ffSpDive .55s cubic-bezier(.7,0,.9,.2) 1.55s forwards; }
.ff-sp-logo svg { display: block; width: 100%; height: 100%; }
.ff-sp-streaks { position: absolute; left: 50%; top: 50%; width: 0; height: 0; }
.ff-sp-streaks i { position: absolute; left: 0; top: 0; width: 0; height: 0; }
.ff-sp-streaks b { position: absolute; left: 0; top: -1.5px; width: 12px; height: 3px; border-radius: 3px; opacity: 0; transform-origin: 0 50%; animation: ffSpStreak .6s cubic-bezier(.3,.7,.2,1) 1.52s forwards; }
@keyframes ffSpRib { to { transform: scaleY(1); } }
@keyframes ffSpFade { to { opacity: 0; } }
@keyframes ffSpLogoIn { from { opacity: 0; transform: scale(.94); } to { opacity: 1; transform: none; } }
@keyframes ffSpDive { from { opacity: 1; transform: none; } to { opacity: 0; transform: scale(3.2); } }
@keyframes ffSpStreak { 0% { opacity: 0; transform: translateX(10px) scaleX(.2); } 25% { opacity: 1; } 100% { opacity: 0; transform: translateX(150px) scaleX(4); } }
@keyframes ffSplashOut { to { opacity: 0; visibility: hidden; } }
@media (prefers-reduced-motion: reduce) { #ff-splash { display: none !important; } }

/* ── 3D motion (credentials, payment, order, coupon/coins, steps, presses) ──
   Rules: transform/opacity only; perspective() lives INSIDE each transform (a `perspective` property on a
   parent would make it the containing block for position:fixed pop-ups); every entrance uses fill
   `backwards` so no transform is left behind; no will-change. html.ff-lite (low-end phone) keeps only the
   main entrance; prefers-reduced-motion switches all of it off. */
@keyframes ffCredLift { 0% { transform: perspective(900px) translate3d(0,34px,-120px) rotateX(-62deg); opacity: 0; } 45% { opacity: 1; } 78% { transform: perspective(900px) translate3d(0,-4px,12px) rotateX(5deg); } 100% { transform: perspective(900px) rotateX(0); opacity: 1; } }
@keyframes ffRowFlip { from { transform: perspective(700px) rotateX(-88deg); opacity: 0; } to { transform: perspective(700px) rotateX(0); opacity: 1; } }
@keyframes ffShineSweep { from { transform: translateX(-130%) skewX(-20deg); opacity: 1; } to { transform: translateX(330%) skewX(-20deg); opacity: 1; } }
@keyframes ffCoinSpin { 0% { transform: perspective(500px) rotateY(-540deg) scale(.3); opacity: 0; } 40% { opacity: 1; } 75% { transform: perspective(500px) rotateY(20deg) scale(1.12); } 100% { transform: perspective(500px) rotateY(0) scale(1); opacity: 1; } }
@keyframes ffRing { from { transform: scale(.55); opacity: .55; } to { transform: scale(1.9); opacity: 0; } }
@keyframes ffRise3d { from { transform: perspective(700px) translate3d(0,16px,-40px) rotateX(-40deg); opacity: 0; } to { transform: perspective(700px) rotateX(0); opacity: 1; } }
@keyframes ffTumble { 0% { transform: perspective(400px) translate3d(0,26px,-60px) rotateX(-200deg) rotateZ(-30deg); opacity: 0; } 70% { transform: perspective(400px) translate3d(0,-6px,10px) rotateX(10deg) rotateZ(4deg); opacity: 1; } 100% { transform: perspective(400px) rotateX(0); opacity: 1; } }
@keyframes ffTicketDrop { 0% { transform: perspective(900px) translate3d(0,-26px,-90px) rotateX(58deg); opacity: 0; } 60% { opacity: 1; } 82% { transform: perspective(900px) translate3d(0,3px,8px) rotateX(-6deg); } 100% { transform: perspective(900px) rotateX(0); opacity: 1; } }
@keyframes ffFlipIn { from { transform: perspective(500px) rotateX(-90deg); opacity: 0; } to { transform: perspective(500px) rotateX(0); opacity: 1; } }
@keyframes ffFlipY { from { transform: perspective(400px) rotateY(-180deg) scale(.8); } to { transform: perspective(400px) rotateY(0) scale(1); } }
@keyframes ffStepPop { 0% { transform: perspective(300px) rotateY(90deg) scale(.7); } 70% { transform: perspective(300px) rotateY(-12deg) scale(1.12); } 100% { transform: perspective(300px) rotateY(0) scale(1); } }
.ff-3d-cred { position: relative; overflow: hidden; animation: ffCredLift .62s cubic-bezier(.2,.85,.3,1.1) .08s backwards; }
.ff-3d-cred::after { content: ''; position: absolute; top: -10%; bottom: -10%; left: 0; width: 38%; pointer-events: none; background: linear-gradient(100deg, transparent, rgba(255,255,255,.75), transparent); opacity: 0; animation: ffShineSweep .7s ease-out .62s backwards; }
.ff-3d-cred > * { animation: ffRowFlip .36s cubic-bezier(.2,.8,.3,1.15) backwards; transform-origin: 50% 0; }
.ff-3d-cred > :nth-child(1) { animation-delay: .22s; } .ff-3d-cred > :nth-child(2) { animation-delay: .32s; }
.ff-3d-cred > :nth-child(3) { animation-delay: .42s; } .ff-3d-cred > :nth-child(4) { animation-delay: .52s; }
.ff-3d-cred > :nth-child(5) { animation-delay: .60s; } .ff-3d-cred > :nth-child(n+6) { animation-delay: .68s; }
.ff-3d-badge { position: relative; display: inline-block; animation: ffCoinSpin .72s cubic-bezier(.2,.8,.3,1.1) backwards; }
.ff-3d-badge::before { content: ''; position: absolute; left: 50%; top: 50%; width: 1.15em; height: 1.15em; margin: -.575em 0 0 -.575em; border-radius: 50%; border: 3px solid rgba(34,197,94,.55); pointer-events: none; opacity: 0; animation: ffRing .8s ease-out .5s backwards; }

.ff-3d-ticket::after { content: ''; position: absolute; top: -10%; bottom: -10%; left: 0; width: 34%; pointer-events: none; background: linear-gradient(100deg, transparent, rgba(255,255,255,.35), transparent); opacity: 0; animation: ffShineSweep .8s ease-out .5s backwards; }
.ff-3d-flipin { animation: ffFlipIn .34s cubic-bezier(.2,.8,.3,1.2) backwards; transform-origin: 50% 0; }

.ff-btn:active:not(:disabled) { transform: perspective(600px) translate3d(0,2px,-10px) scale(.975) !important; }
.ff-tool:active { transform: perspective(700px) rotateX(7deg) scale(.97) !important; }

html.ff-lite .ff-3d-cred > *, html.ff-lite .ff-3d-cred::after, html.ff-lite .ff-3d-ticket::after,
