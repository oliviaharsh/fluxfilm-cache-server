<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; min-height: 100dvh; -webkit-font-smoothing: antialiased; background: #ffffff; }

/* ── Layout shell (responsive: phone · tablet · computer) ── */
html, body { background: #f5f7fb; }
#root { min-height: 100dvh; }
.page-inner { padding: 0 16px; margin: 0 auto; width: 100%; }
.ff-w-wide { max-width: 1120px; }
.ff-w-flow { max-width: 620px; }
.ff-has-bnav { padding-bottom: calc(72px + env(safe-area-inset-bottom)); }
.ff-topbar { position: sticky; top: 0; z-index: 20; background: rgba(255,255,255,.92); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border-bottom: 1px solid rgba(15,23,42,.08); }
.ff-topbar-in { max-width: 1120px; margin: 0 auto; padding: 10px 16px; display: flex; align-items: center; gap: 10px; }
.ff-desk-nav { display: none; }
.ff-help { flex-shrink: 0; display: inline-flex; align-items: center; gap: 6px; padding: 8px 12px; border-radius: 999px; border: 1px solid rgba(22,163,74,.28); background: rgba(22,163,74,.08); color: #15803d; font-size: 13px; font-weight: 800; cursor: pointer; white-space: nowrap; }
.ff-help:hover { background: rgba(22,163,74,.14); }
.ff-help-long { display: none; }
@media (max-width: 899px) { .ff-help-deskonly { display: none; } }
.ff-bnav { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; display: grid; grid-template-columns: repeat(5, minmax(0,1fr)); gap: 2px; background: rgba(255,255,255,.97); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid rgba(15,23,42,.08); padding: 6px 8px calc(6px + env(safe-area-inset-bottom)); box-shadow: 0 -6px 24px rgba(15,23,42,.06); }
.ff-bnav-btn { border: 0; background: none; display: flex; flex-direction: column; align-items: center; gap: 3px; font-size: 11px; white-space: nowrap; font-weight: 700; color: #64748b; padding: 7px 0 6px; border-radius: 14px; cursor: pointer; }
.ff-bnav-ic { font-size: 20px; line-height: 1; }
.ff-bnav-btn.on { color: #15803d; background: rgba(22,163,74,.09); }
@keyframes ffSlideIn { from { transform: perspective(1400px) translate3d(30px,0,-24px) rotateY(-7deg); opacity: 0; } to { transform: perspective(1400px) rotateY(0); opacity: 1; } }
@keyframes ffSlideBack { from { transform: perspective(1400px) translate3d(-30px,0,-24px) rotateY(7deg); opacity: 0; } to { transform: perspective(1400px) rotateY(0); opacity: 1; } }
.ff-slide { animation: ffSlideIn .26s cubic-bezier(.2,.8,.3,1) backwards; transform-origin: 50% 30%; }
html.ff-lite .ff-slide { animation-duration: .2s; }
.ff-slide-back { animation-name: ffSlideBack; }
@media (prefers-reduced-motion: reduce) { .ff-slide { animation: none; } }
.ff-refbar { display: flex; align-items: center; gap: 10px; margin: 14px 0 0; padding: 11px 14px; border-radius: 16px; background: linear-gradient(135deg,rgba(236,72,153,.10),rgba(245,158,11,.10)); border: 1px solid rgba(236,72,153,.22); font-size: 13.5px; font-weight: 700; color: #831843; }
.ff-refbar b { font-weight: 800; }
.ff-refbar button { margin-left: auto; border: 0; background: none; color: #9d174d; font-size: 18px; cursor: pointer; line-height: 1; padding: 2px 4px; }
.ff-ref-hero { text-align: center; padding: 22px 18px !important; background: linear-gradient(160deg,#fdf2f8,#fff7ed) !important; border-color: rgba(236,72,153,.18) !important; }
.ff-ref-hero h3 { font-size: 21px; font-weight: 800; color: #0f172a; margin: 8px 0 6px; line-height: 1.25; }
.ff-ref-hero p { font-size: 13.5px; color: #64748b; font-weight: 600; line-height: 1.5; }
.ff-ref-code { display: flex; align-items: center; gap: 8px; margin: 16px auto 0; max-width: 360px; padding: 8px 8px 8px 16px; border-radius: 16px; background: #fff; border: 1.5px dashed rgba(236,72,153,.45); }
.ff-ref-code span { font-family: Consolas, 'SF Mono', monospace; font-size: 20px; font-weight: 800; letter-spacing: .12em; color: #0f172a; }
.ff-ref-code button { margin-left: auto; border: 1px solid rgba(15,23,42,.12); background: #fff; border-radius: 12px; padding: 8px 12px; font-size: 13px; font-weight: 800; color: #334155; cursor: pointer; font-family: inherit; }
.ff-ref-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 12px; }
.ff-ref-steps { display: grid; gap: 10px; }
.ff-ref-step { display: flex; gap: 12px; align-items: flex-start; }
.ff-ref-step b { flex-shrink: 0; width: 28px; height: 28px; border-radius: 999px; background: rgba(236,72,153,.12); color: #9d174d; display: grid; place-items: center; font-size: 13px; font-weight: 800; }
.ff-ref-step div { font-size: 13.5px; color: #334155; font-weight: 600; line-height: 1.45; padding-top: 4px; }
.ff-stats3 { display: grid; grid-template-columns: repeat(3, minmax(0,1fr)); gap: 10px; }
.ff-stat { text-align: center; padding: 12px 6px; border-radius: 14px; background: #f8fafc; border: 1px solid rgba(15,23,42,.07); }
.ff-stat-n { font-size: 22px; font-weight: 800; color: #0f172a; line-height: 1; }
.ff-stat-l { font-size: 11.5px; font-weight: 700; color: #64748b; margin-top: 5px; }
.ff-friend { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.ff-friend + .ff-friend { border-top: 1px solid rgba(15,23,42,.07); }
.ff-wallet-hero { text-align: center; padding: 24px 18px !important; background: linear-gradient(160deg,#fffbeb,#f0fdf4) !important; border-color: rgba(245,158,11,.22) !important; }
.ff-wallet-n { font-size: 44px; font-weight: 800; color: #0f172a; line-height: 1; margin-top: 6px; }
.ff-coin { display: flex; align-items: center; gap: 12px; margin-top: 14px; padding: 12px 14px; border-radius: 16px; border: 1.5px solid rgba(245,158,11,.35); background: linear-gradient(135deg,#fffbeb,#fff); cursor: pointer; user-select: none; }
.ff-coin.on { border-color: #d97706; background: linear-gradient(135deg,#fef3c7,#fffbeb); box-shadow: 0 4px 16px rgba(245,158,11,.18); }
.ff-coin-box { width: 24px; height: 24px; border-radius: 8px; border: 2px solid #d97706; display: grid; place-items: center; font-size: 14px; font-weight: 900; color: #fff; flex-shrink: 0; background: #fff; }
.ff-coin.on .ff-coin-box { background: #d97706; }
.ff-coin-t { font-size: 14.5px; font-weight: 800; color: #78350f; }
.ff-coin-s { font-size: 12px; font-weight: 600; color: #92400e; margin-top: 2px; }
.ff-coin-amt { margin-left: auto; font-size: 17px; font-weight: 800; color: #b45309; white-space: nowrap; }
.ff-coin-note { margin-top: 12px; padding: 10px 12px; border-radius: 12px; background: #fffbeb; font-size: 12.5px; font-weight: 600; color: #92400e; }
.ff-hist { display: flex; align-items: center; gap: 10px; padding: 10px 0; }
.ff-hist + .ff-hist { border-top: 1px solid rgba(15,23,42,.07); }
.ff-acard { display: flex; align-items: center; gap: 14px; cursor: pointer; }
.ff-avatar { flex-shrink: 0; border-radius: 999px; background: linear-gradient(135deg,#34d399,#16a34a); display: grid; place-items: center; color: #fff; font-weight: 800; overflow: hidden; box-shadow: 0 4px 14px rgba(22,163,74,.22); }
.ff-avatar img { width: 100%; height: 100%; object-fit: cover; }
.ff-alist { margin-top: 12px; padding: 4px 0 !important; }
.ff-arow { width: 100%; display: flex; align-items: center; gap: 12px; padding: 14px 16px; background: none; border: 0; text-align: left; cursor: pointer; font-family: inherit; }
.ff-arow + .ff-arow { border-top: 1px solid rgba(15,23,42,.07); }
.ff-arow:hover { background: #f8fafc; }
.ff-arow-ic { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 21px; flex-shrink: 0; }
.ff-arow-t { font-size: 15px; font-weight: 800; color: #0f172a; }
.ff-arow-s { font-size: 12.5px; font-weight: 600; color: #64748b; margin-top: 2px; }
.ff-arow-go { margin-left: auto; color: #94a3b8; font-size: 22px; line-height: 1; flex-shrink: 0; }
.ff-pill { margin-left: auto; flex-shrink: 0; padding: 4px 10px; border-radius: 999px; font-size: 11.5px; font-weight: 800; }
.ff-pill.soon { background: rgba(245,158,11,.10); border: 1px solid rgba(245,158,11,.28); color: #92400e; }
.ff-pill.count { background: rgba(22,163,74,.10); border: 1px solid rgba(22,163,74,.25); color: #15803d; }
.ff-subhead { display: flex; align-items: center; gap: 10px; margin: 16px 0 6px; }
.ff-subhead button { border: 1px solid rgba(15,23,42,.10); background: #fff; border-radius: 999px; padding: 8px 14px 8px 10px; font-size: 13.5px; font-weight: 800; color: #334155; cursor: pointer; font-family: inherit; }
.ff-subhead h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
.ff-coupon { display: flex; background: #fff; border: 1px solid rgba(15,23,42,.09); border-radius: 20px; overflow: hidden; box-shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.06); }
.ff-coupon + .ff-coupon { margin-top: 12px; }
.ff-coupon-amt { flex-shrink: 0; width: 104px; background: linear-gradient(160deg,#22c55e,#15803d); color: #fff; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 14px 8px; position: relative; }
.ff-coupon-amt::after { content: ''; position: absolute; right: -1px; top: 10px; bottom: 10px; border-right: 2px dashed rgba(255,255,255,.55); }
.ff-coupon-big { font-size: 26px; font-weight: 800; line-height: 1; }
.ff-coupon-off { font-size: 12px; font-weight: 800; letter-spacing: .12em; margin-top: 4px; }
.ff-coupon-cap { font-size: 10.5px; font-weight: 700; opacity: .9; margin-top: 6px; }
.ff-coupon-body { flex: 1; min-width: 0; padding: 14px 14px 12px; }
.ff-coupon-top { display: flex; align-items: center; gap: 8px; }
.ff-coupon-code { font-family: Consolas, 'SF Mono', monospace; font-size: 15px; font-weight: 800; letter-spacing: .06em; color: #0f172a; padding: 5px 10px; border: 1.5px dashed rgba(22,163,74,.45); border-radius: 10px; background: rgba(22,163,74,.05); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.ff-coupon-copy { margin-left: auto; flex-shrink: 0; border: 1px solid rgba(15,23,42,.12); background: #fff; border-radius: 10px; padding: 6px 11px; font-size: 12.5px; font-weight: 800; color: #334155; cursor: pointer; font-family: inherit; }
.ff-coupon-desc { font-size: 13px; font-weight: 700; color: #334155; margin-top: 8px; line-height: 1.4; }
.ff-coupon-facts { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.ff-coupon-facts span { font-size: 11.5px; font-weight: 700; color: #475569; background: #f1f5f9; border-radius: 999px; padding: 4px 9px; }
.ff-tabs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 2px 4px; margin: 4px 0 14px; scrollbar-width: none; }
.ff-tabs::-webkit-scrollbar { display: none; }
.ff-tab { flex-shrink: 0; border: 1px solid rgba(15,23,42,.10); background: #fff; color: #334155; padding: 9px 14px; border-radius: 999px; font-size: 13.5px; font-weight: 800; cursor: pointer; white-space: nowrap; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
.ff-tab.on { background: #16a34a; border-color: #16a34a; color: #fff; box-shadow: 0 4px 14px rgba(22,163,74,.25); }
.ff-soon { text-align: center; padding: 28px 18px; }
.ff-soon-ic { font-size: 40px; margin-bottom: 10px; }
.ff-soon h3 { font-size: 18px; font-weight: 800; color: #0f172a; margin-bottom: 6px; }
.ff-soon p { font-size: 13.5px; color: #64748b; font-weight: 500; line-height: 1.55; max-width: 380px; margin: 0 auto 14px; }
.ff-soon-badge { display: inline-block; padding: 6px 14px; border-radius: 999px; background: rgba(245,158,11,.10); border: 1px solid rgba(245,158,11,.28); color: #92400e; font-size: 12.5px; font-weight: 800; }
.ff-steps { display: flex; align-items: flex-start; margin: 16px 0 4px; padding: 12px 10px 10px; background: #fff; border: 1px solid rgba(15,23,42,.08); border-radius: 18px; box-shadow: 0 1px 3px rgba(15,23,42,.05); }
.ff-step { flex: 1; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 5px; position: relative; }
.ff-step + .ff-step::before { content: ''; position: absolute; top: 13px; right: 50%; width: 100%; height: 2px; background: #e2e8f0; z-index: 0; }
.ff-step.done::before, .ff-step.on::before { background: #22c55e; }
.ff-step-n { position: relative; z-index: 1; width: 28px; height: 28px; border-radius: 999px; display: grid; place-items: center; font-size: 13px; font-weight: 800; background: #f1f5f9; color: #94a3b8; border: 2px solid #e2e8f0; }
.ff-step.done .ff-step-n { background: #22c55e; border-color: #22c55e; color: #fff; }
.ff-step.on .ff-step-n { background: #fff; border-color: #16a34a; color: #15803d; box-shadow: 0 0 0 4px rgba(22,163,74,.14); }
.ff-step-l { font-size: 11.5px; font-weight: 700; color: #94a3b8; white-space: nowrap; }
.ff-step.on .ff-step-l { color: #15803d; font-weight: 800; }
.ff-step.done .ff-step-l { color: #334155; }
.ff-grid-svc { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; }
.ff-cards { display: grid; grid-template-columns: minmax(0,1fr); gap: 12px; }
.ff-cards > * { margin: 0 !important; }
.ff-home { display: flex; flex-direction: column; }
.ff-home-left, .ff-home-right { display: contents; }
.ff-o1 { order: 1; } .ff-o2 { order: 2; } .ff-o3 { order: 3; } .ff-o4 { order: 4; } .ff-o5 { order: 5; } .ff-o6 { order: 6; }
.ff-home-points { display: none; }
@media (min-width: 640px) {
  .ff-grid-svc { grid-template-columns: repeat(3, minmax(0,1fr)); gap: 14px; }
}
@media (min-width: 700px) {
  .ff-cards { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 14px; }
}
@media (max-width: 899px) {
  .ff-home { max-width: 620px; margin: 0 auto; }
}
@media (min-width: 900px) {
  .page-inner { padding: 0 28px; }
  .ff-topbar-in { padding: 12px 28px; gap: 14px; }
  .ff-desk-nav { display: flex; align-items: center; gap: 4px; margin-left: auto; }
  .ff-desk-nav button { border: 0; background: none; padding: 9px 14px; border-radius: 12px; font-size: 14px; font-weight: 700; color: #334155; cursor: pointer; }
  .ff-desk-nav button:hover { background: #f1f5f9; }
  .ff-desk-nav button.on { background: rgba(22,163,74,.10); color: #15803d; }
  .ff-help { padding: 9px 16px; font-size: 14px; }
  .ff-help-long { display: inline; }
  .ff-help-short { display: none; }
  .ff-bnav { display: none; }
  .ff-has-bnav { padding-bottom: 32px; }
  .ff-topbar-pill { display: none !important; }
  .ff-cards { grid-template-columns: repeat(2, minmax(0,1fr)); gap: 16px; }
  .ff-steps { margin-top: 22px; padding: 14px 18px 12px; }
  .ff-step-l { font-size: 12.5px; }
  .ff-home { display: grid; grid-template-columns: minmax(0,1.1fr) minmax(0,1fr); column-gap: 56px; align-items: start; padding-top: 28px; }
  .ff-home-left, .ff-home-right { display: block; }
  .ff-home-left { position: sticky; top: 96px; }
  .ff-home-hero { text-align: left !important; padding: 36px 0 28px !important; }
  .ff-home-logo { margin: 0 0 22px !important; width: 76px !important; height: 76px !important; font-size: 34px !important; }
  .ff-home-h1 { font-size: 46px !important; line-height: 1.05 !important; letter-spacing: -1.2px !important; }
  .ff-home-tag { font-size: 18px !important; max-width: 460px; }
  .ff-home-tag br { display: none; }
  .ff-home-points { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 22px; }
  .ff-home-points span { padding: 8px 14px; border-radius: 999px; background: #fff; border: 1px solid rgba(15,23,42,.09); font-size: 13.5px; font-weight: 700; color: #334155; }
  .ff-home-right > * + * { margin-top: 14px; }
}
@media (min-width: 1100px) {
  .ff-grid-svc { grid-template-columns: repeat(4, minmax(0,1fr)); }
}
@keyframes popcornFloat { 0%,100%{transform:translateY(0) rotate(0) scale(1)} 25%{transform:translateY(-2px) rotate(-1deg) scale(1.02)} 50%{transform:translateY(-4px) rotate(0) scale(1.03)} 75%{transform:translateY(-2px) rotate(1deg) scale(1.02)} }
@keyframes popcornGlow { 0%,100%{box-shadow:0 6px 18px rgba(22,163,74,.22)} 50%{box-shadow:0 10px 28px rgba(22,163,74,.36)} }
@keyframes popcornPop { 0%{transform:scale(1)} 40%{transform:scale(1.10)} 100%{transform:scale(1)} }
@keyframes popcornShake { 0%,100%{transform:rotate(0)} 20%{transform:rotate(-4deg)} 40%{transform:rotate(4deg)} 60%{transform:rotate(-3deg)} 80%{transform:rotate(3deg)} }
@keyframes spin { to{transform:rotate(360deg)} }
@keyframes slideUp { from{transform:translateY(40px);opacity:0} to{transform:translateY(0);opacity:1} }
@keyframes popIn { 0%{transform:scale(.86);opacity:0} 70%{transform:scale(1.06);opacity:1} 100%{transform:scale(1);opacity:1} }
@keyframes softPulse { 0%,100%{transform:scale(1);box-shadow:0 8px 24px rgba(22,163,74,.22)} 50%{transform:scale(1.04);box-shadow:0 14px 34px rgba(22,163,74,.34)} }
@keyframes fadeSlide { from{transform:translateY(8px);opacity:0} to{transform:translateY(0);opacity:1} }
button { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }
button:active { transform: scale(.98) !important; }
input { font-family: 'Plus Jakarta Sans', ui-sans-serif, system-ui, sans-serif; }

/* ── Tools tiles (home + My plans) ── */
.ff-tools-head { display: flex; align-items: baseline; gap: 10px; margin: 0 2px 10px; }
.ff-tools-head h2 { font-size: 18px; font-weight: 800; color: #0f172a; }
.ff-tools-head span { font-size: 12.5px; font-weight: 700; color: #94a3b8; }
.ff-tools-grid { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 12px; }
.ff-tool { position: relative; display: flex; flex-direction: column; align-items: flex-start; gap: 4px; min-height: 168px; padding: 16px 14px 14px; border-radius: 22px; border: 1px solid rgba(15,23,42,.09); background: #fff; box-shadow: 0 1px 3px rgba(15,23,42,.06), 0 8px 24px rgba(15,23,42,.07); text-align: left; cursor: pointer; overflow: hidden; transition: box-shadow .18s ease, border-color .18s ease; -webkit-tap-highlight-color: transparent; }
.ff-tool::after { content: ''; position: absolute; right: -34px; top: -34px; width: 110px; height: 110px; border-radius: 999px; opacity: .10; pointer-events: none; }
.ff-tool:hover { box-shadow: 0 2px 6px rgba(15,23,42,.08), 0 14px 32px rgba(15,23,42,.10); }
.ff-tool:focus-visible, .ff-tools-soon button:focus-visible { outline: 3px solid rgba(22,163,74,.45); outline-offset: 2px; }
.ff-tool-ic { width: 52px; height: 52px; border-radius: 16px; display: grid; place-items: center; font-size: 26px; line-height: 1; margin-bottom: 8px; flex-shrink: 0; }
.ff-tool-t { font-size: 15.5px; font-weight: 800; color: #0f172a; line-height: 1.25; }
.ff-tool-s { font-size: 12.5px; font-weight: 600; color: #64748b; line-height: 1.4; }
.ff-tool-go { margin-top: auto; padding-top: 10px; font-size: 14px; font-weight: 800; }
.ff-tool-otp { border-color: rgba(124,58,237,.18); }
.ff-tool-otp::after { background: #7c3aed; }
.ff-tool-otp .ff-tool-ic { background: linear-gradient(135deg,#a78bfa,#7c3aed); box-shadow: 0 6px 16px rgba(124,58,237,.28); }
.ff-tool-otp .ff-tool-go { color: #6d28d9; }
.ff-tool-nf { border-color: rgba(229,9,20,.16); }
.ff-tool-nf::after { background: #e50914; }
.ff-tool-nf .ff-tool-ic { background: linear-gradient(135deg,#f43f5e,#b20710); box-shadow: 0 6px 16px rgba(229,9,20,.24); }
.ff-tool-nf .ff-tool-go { color: #b91c1c; }
.ff-tools-soon { display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); gap: 10px; margin-top: 10px; }
.ff-tools-soon button { display: flex; align-items: center; gap: 6px; padding: 11px 12px; border-radius: 16px; border: 1px dashed rgba(15,23,42,.16); background: rgba(255,255,255,.6); font-size: 13px; font-weight: 700; color: #475569; cursor: pointer; text-align: left; min-width: 0; }
